<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeaCrew — регистрация моряка</title>
<style>
:root{
  --bg:#0B1117;--page:#070C11;--surface:#121A22;--raised:#1A2430;--nav:#0E151C;--input:#0F1720;
  --border:#243242;--divider:#16202B;--strong:#3A4A5C;
  --t1:#E8EEF3;--t2:#9AA8B5;--t3:#96A3AF;--muted:#5C6B79;
  --accent:#2EC4B6;--accentHi:#5FD9CE;--onAccent:#062723;
  --tint08:rgba(var(--accentRGB),.08);--tint:rgba(var(--accentRGB),.12);--accentBorder:rgba(var(--accentRGB),.25);
  --success:#3FB950;--successBg:rgba(63,185,80,.12);
  --warning:#E3A008;--warningBg:rgba(227,160,8,.14);--warningSoft:rgba(227,160,8,.07);--warningBorder:rgba(227,160,8,.35);
  --danger:#F26A6A;--dangerBg:rgba(242,106,106,.12);--dangerBorder:rgba(242,106,106,.35);
  --accentRGB:46,196,182;--docA:#1E2A36;--docB:#141D26;--docLine:#2A3846;--heroA:#0E1922;--chrome:#05080B;--homeBar:#E8EEF3;--shadow:rgba(0,0,0,.35);
}
.screen.light{
  --bg:#F4F6F8;--surface:#FFFFFF;--raised:#EBEFF3;--nav:#FFFFFF;--input:#F9FAFB;
  --border:#C9D2DB;--divider:#E6EBF0;--strong:#8C99A6;
  --t1:#0B1117;--t2:#4A5866;--t3:#55616D;--muted:#7A8794;
  --accent:#096E64;--accentHi:#0B8578;--onAccent:#FFFFFF;
  --tint08:rgba(9,110,100,.08);--tint:rgba(9,110,100,.12);--accentBorder:rgba(9,110,100,.25);
  --success:#177030;--successBg:rgba(23,112,48,.12);
  --warning:#845600;--warningBg:rgba(132,86,0,.14);--warningSoft:rgba(132,86,0,.07);--warningBorder:rgba(132,86,0,.35);
  --danger:#B82525;--dangerBg:rgba(184,37,37,.12);--dangerBorder:rgba(184,37,37,.35);
  --accentRGB:9,110,100;--docA:#E9EEF2;--docB:#DCE3E9;--docLine:#C3CDD6;--heroA:#E3EFEE;--homeBar:#0B1117;--shadow:rgba(11,17,23,.12);
  color:var(--t1);
}
.screen.light .status{color:#0B1117}
.screen.light .sheet{background:rgba(11,17,23,.4)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--t1);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
input::placeholder{color:var(--muted)}
a{color:var(--accent);text-decoration:none}
svg{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes ring{from{stroke-dashoffset:302}to{stroke-dashoffset:0}}
@keyframes shimmer{0%{opacity:.45}50%{opacity:1}100%{opacity:.45}}
@keyframes scan{0%{top:6%}50%{top:86%}100%{top:6%}}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes boxpop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
@keyframes typeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes sk{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes waveX{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sweep{0%{left:-70%}45%,100%{left:120%}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(var(--accentRGB),0)}50%{box-shadow:0 0 18px 2px rgba(var(--accentRGB),.35)}}
@keyframes zap{0%,40%,100%{transform:scale(1);opacity:1}46%{transform:scale(1.18);opacity:.75}52%{transform:scale(.96);opacity:1}}
@keyframes drawOnce{to{stroke-dashoffset:0}}
@keyframes draw{0%{stroke-dashoffset:24}35%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:-24}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes conf{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 40px)) rotate(var(--rot)) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes dropSweep{0%,30%{background-position:120% 0}70%,100%{background-position:-20% 0}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(var(--accentRGB),0)}50%{box-shadow:0 0 0 6px rgba(var(--accentRGB),.10)}}
@keyframes growIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pgIn{from{opacity:0;transform:scale(.7) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sink{to{transform:translateY(100%)}}
@keyframes readyPulse{0%{box-shadow:0 0 0 0 rgba(var(--accentRGB),.5)}100%{box-shadow:0 0 0 14px rgba(var(--accentRGB),0)}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,30px) scale(1.12)}}
@keyframes rock{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(1px)}}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.35)}}
@keyframes bubble{0%{opacity:0;transform:translate(0,0)}15%{opacity:.5}100%{opacity:0;transform:translate(var(--bx),-150px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}.stag,.act,.sheet .in > .btn{opacity:1!important;animation:none!important}.choice .lines svg path{stroke-dasharray:none!important;stroke-dashoffset:0!important}.drop::before,.choice.hi::before,.bub,.burst{display:none!important}}

/* панель обзора */
.bar{position:sticky;top:0;z-index:10;background:rgba(7,12,17,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap;justify-content:center}
.seg button{background:none;border:none;color:var(--t2);font-size:13px;font-weight:600;padding:9px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--onAccent)}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.nav button,.nav select{background:var(--surface);border:1px solid var(--border);color:var(--t1);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer}
.nav select{max-width:300px}
.opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:12px;color:var(--t2)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts select{background:var(--surface);border:1px solid var(--border);color:var(--t1);border-radius:8px;padding:6px 8px;font-size:12px}
.note{max-width:760px;font-size:13px;line-height:1.5;color:var(--t2);text-align:center}
.note b{color:var(--t1)}
.note.dev{border:1px dashed var(--strong);border-radius:10px;padding:8px 12px;text-align:left}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent)}

/* сцена и телефон */
.stage{display:flex;justify-content:center;padding:24px 12px 48px}
.frameA{width:100%;max-width:1100px;height:calc(100vh - 150px);min-height:900px;border:1px solid var(--border);border-radius:14px;background:var(--page)}
.phone{width:390px;height:844px;max-width:100%;border-radius:54px;background:#05080B;padding:11px;box-shadow:0 0 0 1px #2A3644,0 0 0 4px #0D141B,0 40px 90px rgba(0,0,0,.55);flex-shrink:0}
.screen{position:relative;width:100%;height:100%;border-radius:44px;background:var(--bg);color:var(--t1);transition:background .25s;overflow:hidden;display:flex;flex-direction:column}
.status{height:50px;position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 32px 0 34px;font-size:15px;font-weight:600;z-index:4;pointer-events:none}
.status .sig{display:flex;gap:5px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:3}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--homeBar);opacity:.85;z-index:6}
.inner{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:50px;animation:enter .22s ease-out}
.inner.fw{animation:inR .26s cubic-bezier(.2,.8,.2,1)}
.inner.bw{animation:inL .26s cubic-bezier(.2,.8,.2,1)}
.inner.still{animation:none}
.body{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:8px 22px 24px;gap:14px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body > *{flex-shrink:0}
.body > .hero.grow{flex-shrink:1}
.body.center{justify-content:center}
.inner > .body:last-child{padding-bottom:44px}
.welcome{gap:14px}
.underbar{margin-top:-50px}
.underbar .hero{margin-top:-8px;padding-top:96px}
.welcome .card{padding:16px}
.feats{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.feat{display:inline-flex;align-items:center;gap:5px;padding:6px 10px 6px 8px;border-radius:20px;background:var(--tint);border:1px solid var(--accentBorder);color:var(--t1);font-size:12.5px;font-weight:600;backdrop-filter:blur(6px)}
.feat svg{color:var(--accent)}
.stag{opacity:0;animation:riseIn .32s cubic-bezier(.2,.8,.2,1) forwards}
.inner.still .stag,.inner.bw .stag{opacity:1;animation:none}
.choice{position:relative;overflow:hidden}
.choice:active{transform:scale(.97);transition-duration:.09s}
.choice.hi::before{content:'';position:absolute;top:0;bottom:0;width:60%;left:-70%;background:linear-gradient(100deg,rgba(var(--accentRGB),0),rgba(var(--accentRGB),.14),rgba(var(--accentRGB),0));animation:sweep 6s 1.2s ease-in-out infinite;pointer-events:none}
.choice.hi .ico svg{animation:zap 1.2s .5s ease-in-out 1}
.choice .lines svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:drawOnce .9s .55s ease-out forwards}
.welcome .hero.grow{max-height:500px}
.hero > *{flex-shrink:0}
.foot{flex-shrink:0;padding:12px 22px 30px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.foot.line{border-top:1px solid var(--border);background:var(--bg)}

/* типографика */
.h1{font-size:28px;font-weight:700;line-height:1.18;letter-spacing:-.3px;text-wrap:balance}
.h2{font-size:17px;font-weight:700;line-height:1.3}
.h3{font-size:15px;font-weight:600;line-height:1.3}
.sub{font-size:15px;color:var(--t2);line-height:1.45}
.small{font-size:13px;color:var(--t2);line-height:18px}
.over{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--t2)}

/* кнопки */
.btn{border:none;border-radius:12px;min-height:50px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.p{transition:transform .12s,opacity .2s,box-shadow .25s,filter .15s}
.btn.p:not([disabled]){box-shadow:0 6px 18px rgba(var(--accentRGB),.22)}
.btn.s:active,.btn.g:active,.btn.d:active{opacity:.6}
.btn.ready{animation:readyPulse .6s ease-out}
.back:active,.link:active{opacity:.5}
.btn.p{background:var(--accent);color:var(--onAccent)}
.btn.s{background:var(--raised);color:var(--t1);border:1px solid var(--border)}
.btn.g{background:none;color:var(--accent);font-weight:500;font-size:15px;min-height:44px;padding:8px}
.btn.d{background:none;color:var(--danger);font-weight:500;font-size:15px;min-height:44px;padding:8px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.busy{pointer-events:none}
.btn.off{opacity:.38}
.btn .sp{width:18px;height:18px;border:2.5px solid rgba(6,39,35,.25);border-top-color:var(--onAccent);border-radius:50%;animation:spin .8s linear infinite}
.back{background:none;border:none;color:var(--t1);padding:10px;margin-left:-10px;cursor:pointer;min-height:44px;min-width:44px;align-self:flex-start;display:flex;align-items:center;justify-content:center}
.link{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:12px 0;margin:-12px 0}

/* поля */
.field{display:flex;flex-direction:column;gap:6px}
.field .lr{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:18px}
.field label{font-size:13px;color:var(--t2)}
.ctl{position:relative}
.field input,.field select{width:100%;background:var(--input);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--t1);font-size:15px;min-height:46px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--accent)}
.field input.err{border-color:var(--danger)}
.field input.ok{border-color:rgba(63,185,80,.55)}
.field input[readonly]{color:var(--t2);background:var(--surface)}
.field .eye{position:absolute;right:1px;top:50%;transform:translateY(-50%);width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--t2);cursor:pointer}
.field .msg{font-size:12px;line-height:1.4;min-height:0}
.field .msg.e{color:var(--danger)}
.field .msg.n{color:var(--t2)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--tint);color:var(--accent);white-space:nowrap}
.tag.w{background:var(--warningBg);color:var(--warning)}
.tag.m{background:var(--raised);color:var(--t2)}
.tag.ok{background:var(--successBg);color:var(--success)}
.meter{display:flex;gap:4px}
.meter span{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .2s}

/* карточки */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card.hi{border-color:var(--accentBorder);background:linear-gradient(180deg,rgba(var(--accentRGB),.07),rgba(var(--accentRGB),.02))}
.choice{cursor:pointer;text-align:left;color:var(--t1);transition:transform .16s cubic-bezier(.3,1.4,.5,1),border-color .15s,background .15s}
.row{display:flex;gap:12px;align-items:center}
.ico{width:42px;height:42px;border-radius:12px;background:var(--raised);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.ico.acc{background:var(--tint);border-color:var(--accentBorder)}
.ico.big{width:64px;height:64px;border-radius:18px}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.45;color:var(--t1)}
.box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--onAccent);margin-top:1px;transition:background .15s,border-color .15s}
.box.on{background:var(--accent);border-color:var(--accent)}
.box.pop{animation:boxpop .28s ease-out}
.shake{animation:shake .4s}
.toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);z-index:7;background:var(--raised);color:var(--t1);border:1px solid var(--border);border-radius:14px;padding:4px 12px 4px 14px;display:flex;gap:12px;align-items:center;font-size:14px;white-space:nowrap;box-shadow:0 10px 30px var(--shadow);animation:toastIn .22s ease-out;overflow:hidden}
.toast .tbar{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);animation:tbar 4s linear forwards}
@keyframes tbar{from{width:100%}to{width:0}}
.toast button{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;padding:12px 8px;min-height:44px}
.burst{position:absolute;left:50%;top:50%;border-radius:2px;animation:conf 1.1s .4s cubic-bezier(.15,.7,.3,1) both}
.found{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.3px;animation:typeIn .3s ease-out;margin-top:2px}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--raised) 0,var(--surface) 50%,var(--raised) 100%);background-size:400px 100%;animation:sk 1.1s linear infinite}
.pg .beam{position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 12px 3px rgba(var(--accentRGB),.45);animation:scan 1.2s ease-in-out infinite}
button:focus-visible,.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.banner .bi{flex-shrink:0;margin-top:1px}
.banner .bt{display:flex;flex-direction:column;gap:6px;flex:1}
.banner.w{background:var(--warningSoft);border:1px solid var(--warningBorder)}
.banner.w .bi{color:var(--warning)}
.banner.i{background:var(--tint08);border:1px solid var(--accentBorder)}
.banner.i .bi{color:var(--accent)}
.banner.d{background:var(--dangerBg);border:1px solid var(--dangerBorder)}
.banner.d .bi{color:var(--danger)}
.banner.ok{background:var(--successBg);border:1px solid rgba(63,185,80,.35)}
.banner.ok .bi{color:var(--success)}
.drop{position:relative;overflow:hidden;border:1.5px dashed var(--strong);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;background:var(--input);transition:border-color .2s,background .2s,transform .15s}
.drop::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(var(--accentRGB),.10) 50%,transparent 70%);background-size:250% 100%;animation:dropSweep 6s ease-in-out infinite;pointer-events:none}
.drop:active{border-color:var(--accent);background:var(--tint08)}
.drop:active{transform:scale(.98);transition-duration:.09s}
.drop .ico{transition:transform .15s}
.drop:active .ico{transform:scale(.92)}
.file{display:flex;gap:12px;align-items:center;background:var(--raised);border:1px solid var(--border);border-radius:12px;padding:10px 8px 10px 12px;font-size:14px;min-height:60px}
.file .meta{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.file .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enter{animation:growIn .38s cubic-bezier(.2,.8,.2,1)}
.popin{animation:boxpop .35s ease-out}
.file .fi{width:36px;height:36px;border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.file .x,.xbtn{margin-left:auto;width:44px;height:44px;border-radius:50%;background:none;border:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s,transform .12s}
.file .x:active,.xbtn:active{background:var(--surface);color:var(--danger)}
.file .x:active,.xbtn:active{transform:scale(.88)}
.prog{height:4px;border-radius:2px;background:var(--border);overflow:hidden;margin-top:6px}
.prog span{display:block;height:100%;background:var(--accent);transition:width .15s linear}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.segc{position:relative;display:flex;background:var(--input);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.segc .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 4.5px);border-radius:9px;background:var(--raised);box-shadow:0 1px 4px var(--shadow),0 0 0 1px var(--accentBorder);transition:transform .32s cubic-bezier(.3,1.2,.4,1)}
.segc .thumb.r{transform:translateX(calc(100% + 3px))}
.segc button{position:relative;z-index:1;flex:1;background:none;border:none;border-radius:9px;padding:9px 6px;cursor:pointer;color:var(--t2);display:flex;flex-direction:column;align-items:center;gap:1px;transition:color .2s}
.segc button b{font-size:13px;font-weight:600}
.segc button span{font-size:12px;opacity:.8}
.segc button.on{color:var(--t1)}
.segc button:active{opacity:.7}
.num{width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.num.ok{background:var(--successBg);color:var(--success)}
.pill{background:var(--raised);border:1px solid var(--border);color:var(--t1);border-radius:20px;padding:8px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.pill.on{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.pages{display:flex;gap:10px}
.pg{width:84px;height:110px;border-radius:10px;background:linear-gradient(160deg,var(--docA),var(--docB));border:1px solid var(--border);position:relative;overflow:hidden;flex-shrink:0}
.pg .ph{position:absolute;left:10px;top:12px;width:24px;height:30px;border-radius:3px;background:var(--docLine)}
.pg .ln{position:absolute;left:40px;right:10px;height:4px;border-radius:2px;background:var(--docLine)}
.pg .mrz{position:absolute;left:8px;right:8px;bottom:10px;height:12px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--docLine) 0 4px,transparent 4px 6px)}
.pg .n{position:absolute;right:6px;top:6px;font-size:10px;font-weight:600;color:var(--t2);background:var(--surface);border-radius:6px;padding:1px 5px}
.pg.add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border:1.5px dashed var(--strong);background:var(--input);color:var(--t2);font-size:11px;cursor:pointer;transition:border-color .2s,color .2s,transform .15s}
.pg.add:active{transform:scale(.95)}
.pg.enter{animation:pgIn .4s cubic-bezier(.2,.9,.3,1.2)}
.docfoot{display:flex;align-items:center;justify-content:space-between;min-height:36px;margin-top:-2px}
.list{display:flex;flex-direction:column;gap:12px}
.li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.dot.ok{background:var(--successBg);color:var(--success)}
.dot.wait{background:var(--raised);color:var(--t2)}
.dot.run{background:var(--tint);color:var(--accent)}
.dot.skip{background:var(--warningBg);color:var(--warning)}
.dot .s{width:12px;height:12px;border:2px solid var(--accentBorder);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:11px 0;border-bottom:1px solid var(--divider)}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--t2)}

/* шторка */
.sheet{position:absolute;inset:0;background:rgba(4,8,12,.62);display:flex;align-items:flex-end;z-index:5;animation:fade .18s}
.sheet .in{width:100%;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding:10px 20px 34px;display:flex;flex-direction:column;gap:12px;animation:rise .24s ease-out;max-height:85%;overflow-y:auto}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--strong);align-self:center;margin-bottom:6px}
.act{display:flex;gap:14px;align-items:center;padding:11px 10px;margin:0 -10px;border-radius:12px;cursor:pointer;font-size:15px;transition:background .15s;opacity:0;animation:riseIn .34s cubic-bezier(.2,.8,.2,1) forwards}
.act + .act{box-shadow:0 -1px 0 var(--divider)}
.act:nth-of-type(1){animation-delay:.06s}.act:nth-of-type(2){animation-delay:.11s}.act:nth-of-type(3){animation-delay:.16s}.act:nth-of-type(4){animation-delay:.21s}
.act:active{background:var(--raised);transform:scale(.99)}
.act .ico{width:40px;height:40px;transition:transform .15s}
.act:active .ico{transform:scale(.9)}
.act .chev{color:var(--t2)}
.sheet.out{animation:fadeOut .2s forwards}
.sheet.out .in{animation:sink .22s ease-in forwards}
.sheet .in > .btn{opacity:0;animation:riseIn .3s .24s forwards}
.legal{font-size:14px;line-height:1.55;color:var(--t2);display:flex;flex-direction:column;gap:10px}
.legal p{margin:0}
.legal b{color:var(--t1)}

/* герой */
.hero{position:relative;margin:-58px -22px 0;padding:84px 22px 88px;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--heroA),var(--bg));overflow:hidden;isolation:isolate}
.hero .glow,.ambient .glow{position:absolute;width:340px;height:340px;right:-120px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(var(--accentRGB),.30),rgba(var(--accentRGB),0) 65%);animation:drift 11s ease-in-out infinite alternate;z-index:-1}
.hero .glow.b,.ambient .glow.b{animation:none!important;width:260px;height:260px;left:-130px;right:auto;top:60px;background:radial-gradient(circle,rgba(var(--accentRGB),.14),rgba(var(--accentRGB),0) 65%);animation-duration:14s;animation-direction:alternate-reverse}
.hero .sea,.ambient .sea{position:absolute;left:0;right:0;bottom:0;height:92px;overflow:hidden;z-index:-1;-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);mask-image:linear-gradient(to bottom,#000 55%,transparent)}
.hero.grow{flex:1;min-height:0}
.underbar .hero.mini{padding:54px 22px 44px}
.hero.mini .sea{height:64px}
.navbar{position:absolute;top:0;left:0;right:0;height:94px;padding:50px 12px 0 18px;display:flex;align-items:center;gap:4px;z-index:3;pointer-events:none;transition:background .2s,box-shadow .2s}
.navbar > *{pointer-events:auto}
.navbar .back{align-self:center;margin-left:0}
.navbar .nt{position:absolute;left:60px;right:60px;top:50px;height:44px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar.scrolled{background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 1px 0 var(--divider)}
.navbar.titled .nt{opacity:1;transform:none}
.navbar .close{margin-left:auto}
.underbar .hero.mini{padding:96px 22px 40px}
.consent{gap:10px;overflow:hidden;padding-bottom:12px}
.underbar.consent .hero.mini{padding:90px 22px 18px}
.consent .hero .h1{margin-top:14px!important}
.consent .card{padding:12px 14px}
.consent .list{gap:10px}
.underbar .hero.compact{padding:98px 22px 8px;background:none}
.hero.compact .h1{margin-top:0!important;font-size:28px}
.btn.t{background:var(--tint);color:var(--accent);border:1px solid var(--accentBorder)}
.btn.dd{background:var(--danger);color:#fff}
.bigtitle{font-size:34px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.need{font-size:13px;color:var(--t2);text-align:center;min-height:18px}
.ambient{position:relative;isolation:isolate}
.ambient-bg .glow{position:absolute;width:340px;height:340px;right:-140px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(var(--accentRGB),.26),rgba(var(--accentRGB),0) 65%);animation:drift 11s ease-in-out infinite alternate}
.ambient-bg .glow.b{width:260px;height:260px;left:-130px;right:auto;top:auto;bottom:80px;background:radial-gradient(circle,rgba(var(--accentRGB),.12),rgba(var(--accentRGB),0) 65%);animation-duration:14s}
.ambient-bg .sea{position:absolute;left:0;right:0;bottom:0;height:120px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);mask-image:linear-gradient(to bottom,#000 55%,transparent)}
.ambient-bg .sea svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.ambient-bg .sea .w1{animation:waveX 16s linear infinite}
.ambient-bg .sea .w2{animation:waveX 24s linear infinite reverse;bottom:-6px}
.ambient-bg .sea .w3{animation:waveX 34s linear infinite;bottom:-12px}
.ambient-bg .bub{position:absolute;bottom:40px;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;animation:bubble 7s ease-in infinite}
.ambient-bg .glow{display:none!important}
.ambient-bg{background:radial-gradient(110% 55% at 100% 0%,rgba(var(--accentRGB),.20),transparent 62%)}
.ambient-bg.tone-warn{background:radial-gradient(110% 55% at 100% 0%,rgba(227,160,8,.16),transparent 62%)}
.ambient-bg.tone-muted{background:radial-gradient(110% 55% at 100% 0%,rgba(154,168,181,.12),transparent 62%)}
.ambient-bg.tone-ok{background:radial-gradient(110% 55% at 100% 0%,rgba(63,185,80,.18),transparent 62%)}
.ambient-bg.tone-warn .glow{background:radial-gradient(circle,rgba(227,160,8,.2),rgba(227,160,8,0) 65%)}
.ambient-bg.tone-muted .glow{background:radial-gradient(circle,rgba(154,168,181,.14),rgba(154,168,181,0) 65%)}
.ambient-bg.tone-warn .sea,.ambient-bg.tone-muted .sea{opacity:.4;filter:grayscale(.7)}
.ambient-bg.tone-ok .glow{background:radial-gradient(circle,rgba(63,185,80,.22),rgba(63,185,80,0) 65%)}
.ambient .sea{height:120px}
.ambient .glow{right:-140px;top:-120px}
.logo.tile svg{animation:bob 3.2s ease-in-out infinite}
.tile.t-warn{color:var(--warning);border-color:var(--warningBorder)}
.tile.t-warn::after{border-color:var(--warning)}
.tile.t-muted{color:var(--t2);border-color:var(--border)}
.tile.t-muted::after{border-color:var(--strong)}
.tile.t-ok{color:var(--success);border-color:rgba(63,185,80,.35)}
.tile.t-ok::after{border-color:var(--success)}
.tone-warn .glow{background:radial-gradient(circle,rgba(227,160,8,.22),rgba(227,160,8,0) 65%)!important}
.tone-muted .glow{background:radial-gradient(circle,rgba(154,168,181,.16),rgba(154,168,181,0) 65%)!important}
.tone-ok .glow{background:radial-gradient(circle,rgba(63,185,80,.22),rgba(63,185,80,0) 65%)!important}
.tone-warn .sea,.tone-muted .sea{opacity:.45;filter:grayscale(.7)}
.tone-warn .bub,.tone-muted .bub{display:none}
.feat.ok{background:var(--successBg);border-color:rgba(63,185,80,.35)}
.feat.ok svg{color:var(--success)}
.scanbox{box-shadow:0 0 0 1px var(--accentBorder),0 18px 50px rgba(var(--accentRGB),.18)}
.hero .sea svg,.ambient .sea svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.hero .sea .w1,.ambient .sea .w1{animation:waveX 16s linear infinite}
.hero .sea .w2,.ambient .sea .w2{animation:waveX 24s linear infinite reverse;bottom:-6px}
.hero .sea .w3,.ambient .sea .w3{animation:waveX 34s linear infinite;bottom:-12px}
.hero .bub,.ambient .bub{position:absolute;bottom:20px;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;animation:bubble 7s ease-in infinite;z-index:-1}
.logo{position:relative;flex-shrink:0;width:60px;height:60px;border-radius:18px;background:linear-gradient(160deg,var(--raised),var(--surface));border:1px solid var(--accentBorder);display:flex;align-items:center;justify-content:center;color:var(--accent);box-shadow:0 10px 28px var(--shadow),inset 0 1px 0 rgba(255,255,255,.06)}
.logo svg{transform-origin:50% 18%;animation:rock 5s ease-in-out infinite}
.logo::after{content:'';position:absolute;inset:-1px;border-radius:18px;border:1.5px solid var(--accent);opacity:0;animation:pulse 1.6s .3s ease-out 1}

/* обработка */
.scanbox{position:relative;width:220px;height:140px;border-radius:14px;background:linear-gradient(160deg,var(--docA),var(--docB));border:1px solid var(--border);overflow:hidden;align-self:center}
.scanbox .ph{position:absolute;left:16px;top:18px;width:40px;height:52px;border-radius:5px;background:var(--docLine)}
.scanbox .ln{position:absolute;left:68px;height:6px;border-radius:3px;background:var(--docLine)}
.scanbox .mrz{position:absolute;left:14px;right:14px;bottom:14px;height:18px;background:repeating-linear-gradient(90deg,var(--docLine) 0 6px,transparent 6px 9px)}
.scanbox .beam{position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 18px 4px rgba(var(--accentRGB),.45);animation:scan 2.2s ease-in-out infinite}
.scanbox .hl{position:absolute;border:1.5px solid var(--accent);border-radius:4px;background:rgba(var(--accentRGB),.12);animation:shimmer 1.4s infinite}

/* успех */
.okring{width:108px;height:108px;align-self:center;position:relative}
.okring circle.track{stroke:var(--border)}
.okring circle.p{stroke:var(--accent);stroke-dasharray:302;animation:ring .7s ease-out forwards}
.okring .mk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent);animation:pop .45s .45s both}

/* мастер */
.whead{flex-shrink:0;padding:0 14px 12px 8px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.whead .top{display:flex;align-items:center;gap:2px}
.whead .t{flex:1;font-size:15px;font-weight:600}
.whead .later{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:8px}
.steps{display:flex;gap:4px;padding:0 6px}
.steps span{flex:1;height:4px;border-radius:3px;background:var(--border)}
.steps span.done{background:var(--accent)}
.steps span.cur{background:var(--accent);opacity:.55}
.tabs{flex-shrink:0;display:flex;border-top:1px solid var(--border);background:var(--nav);padding:8px 0 28px}
.tabs div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--t2)}
.tabs div.on{color:var(--accent)}
.avatar{width:88px;height:88px;border-radius:50%;background:var(--raised);border:1.5px dashed var(--strong);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--t2);font-size:11px;text-align:center;cursor:pointer;align-self:center}
.av{width:60px;height:60px;border-radius:50%;background:var(--tint);border:1px solid var(--accentBorder);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:20px;flex-shrink:0}
.pbar{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--warning);border-radius:3px}

/* онбординг, код, профиль */
.dots{display:flex;gap:8px;justify-content:center;align-items:center;min-height:24px}
.dots button{width:8px;height:8px;border-radius:4px;border:none;padding:0;background:var(--strong);transition:width .3s,background .2s;cursor:pointer}
.dots button.on{width:24px;background:var(--accent)}
.otp{display:flex;gap:8px}
.otp input{flex:1;min-width:0;height:58px;border-radius:12px;border:1px solid var(--border);background:var(--input);color:var(--t1);font-size:24px;font-weight:700;text-align:center;outline:none;padding:0;transition:border-color .15s}
.otp input:focus{border-color:var(--accent)}
.otp input.f{border-color:var(--accentBorder)}
.otp input.err{border-color:var(--danger)}
.menu{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.mi{display:flex;gap:12px;align-items:center;padding:11px 14px;min-height:56px;cursor:pointer;font-size:15px;transition:background .15s}
.mi + .mi{border-top:1px solid var(--divider)}
.mi:active{background:var(--raised)}
.mi .ico{width:34px;height:34px;border-radius:10px}
.mi .mv{margin-left:auto;font-size:14px;color:var(--t2);display:flex;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.grid2 .field{min-width:0}
.tabs div[role=button]:active{opacity:.6}
.field select{appearance:none;-webkit-appearance:none}
@media (max-width:440px){.phone{padding:0;border-radius:0;height:calc(100vh - 190px);min-height:700px;box-shadow:none}.screen{border-radius:0}.island,.home{display:none}}
</style>

  function seaPath(y, amp) {
    var d = 'M0 ' + y;
    for (var i = 0; i < 8; i++) {
      var x0 = i * 97.5;
      d += ' Q ' + (x0 + 48.75) + ' ' + (i % 2 ? y + amp : y - amp) + ' ' + (x0 + 97.5) + ' ' + y;
    }
    return d;
  }

  function sea() {
    var layer = function (cls, y, amp, fill, stroke) {
      return '<svg class="' + cls + '" viewBox="0 0 780 92" preserveAspectRatio="none">' +
        '<path d="' + seaPath(y, amp) + ' V92 H0 Z" fill="' + fill + '"/>' +
        '<path d="' + seaPath(y, amp) + '" fill="none" stroke="' + stroke + '" stroke-width="1.2"/></svg>';
    };
    var bubbles = '';
    var xs = arguments[0] ? [16, 38, 62, 84] : [];
    for (var i = 0; i < xs.length; i++) {
      bubbles += '<span class="bub" style="left:' + xs[i] + '%;--bx:' + ((i % 2 ? 1 : -1) * (6 + i * 2)) + 'px;animation-delay:' + (i * 1.1).toFixed(1) + 's;width:' + (3 + (i % 3)) + 'px;height:' + (3 + (i % 3)) + 'px"></span>';
    }
    return '<div class="glow"></div><div class="glow b"></div>' + bubbles +
      '<div class="sea">' +
      layer('w3', 40, 12, 'rgba(var(--accentRGB),.05)', 'rgba(var(--accentRGB),.24)') +
      layer('w2', 52, 10, 'rgba(var(--accentRGB),.07)', 'rgba(var(--accentRGB),.36)') +

      '</div>';

  function strength(p) {
    if (!p) return 0;
    var s = 0;
    if (p.length >= 8) s++;
    if (p.length >= 12) s++;
    if (/[0-9]/.test(p) && /[a-zA-Zа-яА-Я]/.test(p)) s++;
    if (/[^0-9a-zA-Zа-яА-Я]/.test(p)) s++;
    return Math.min(4, Math.max(p.length >= 8 ? 1 : 0, s));
  }

  function resetCode() {
    S.code = ['', '', '', '', '', '']; S.codeErr = ''; S.codeTries = 5; S.codeCd = 60; S.codeBusy = false; S.cdTok = (S.cdTok || 0) + 1;
  }

  function updateResend() {
    var el = document.getElementById('resend');
    if (!el) return;
    if (S.codeCd > 0) { el.textContent = 'Отправить ещё раз через ' + fmtCd(S.codeCd); el.setAttribute('data-a', 'blocked'); el.style.opacity = '.55'; el.style.fontWeight = ''; }
    else { el.textContent = 'Отправить ещё раз'; el.setAttribute('data-a', 'resend'); el.style.opacity = ''; el.style.fontWeight = '600'; }
  }

  function codeTick(tok) {
    later(function () {
      if (tok !== S.cdTok) return;
      S.codeCd = Math.max(0, S.codeCd - 1);
      updateResend();
      if (S.codeCd > 0) codeTick(tok);
    }, 1000);
  }

  function setCodeMsg(text, err) {
    S.codeErr = err ? text : '';
    var m = document.getElementById('codeMsg');
    if (m) { m.textContent = text; m.style.color = err ? 'var(--danger)' : 'var(--t2)'; }
    var boxes = document.querySelectorAll('#otp input');
    for (var i = 0; i < boxes.length; i++) boxes[i].classList.toggle('err', !!err);
  }

  function verifyCode() {
    var code = S.code.join('');
    if (code.length < 6 || S.codeBusy) return;
    if (S.codeTries <= 0) { setCodeMsg('Попытки закончились. Отправьте код ещё раз.', true); return; }
    S.codeBusy = true;
    setCodeMsg('Проверяем…', false);
    later(function () {
      S.codeBusy = false;
      if (code === '123456') {
        if (S.c === 's1c') {
          S.done[1] = true;
          go('s2');
          showToast('Аккаунт создан', null);
        } else {
          S.fast = true;
          S.done = { 1: true, 2: true, 3: true, 4: true, 6: true };
          go('q08');
        }
        return;
      }
      S.codeTries = Math.max(0, S.codeTries - 1);
      S.code = ['', '', '', '', '', ''];
      var boxes = document.querySelectorAll('#otp input');
      for (var i = 0; i < boxes.length; i++) { boxes[i].value = ''; boxes[i].classList.remove('f'); }
      setCodeMsg(S.codeTries > 0 ? 'Неверный код. Осталось попыток: ' + S.codeTries : 'Неверный код. Попытки закончились — отправьте код ещё раз.', true);
      shake(document.getElementById('otp'));
      if (boxes[0]) boxes[0].focus();
    }, 700);
  }

  function otpInput(el, i) {
    var v = el.value.replace(/\D/g, '');
    var boxes = document.querySelectorAll('#otp input');
    if (S.codeErr) setCodeMsg('', false);
    if (v.length > 1) {
      for (var k = 0; k < v.length && i + k < 6; k++) S.code[i + k] = v.charAt(k);
      for (var j = 0; j < 6; j++) { boxes[j].value = S.code[j]; boxes[j].classList.toggle('f', !!S.code[j]); }
      var nx = Math.min(5, i + v.length);
      boxes[nx].focus();
    } else {
      S.code[i] = v;
      el.value = v;
      el.classList.toggle('f', !!v);
      if (v && i < 5) boxes[i + 1].focus();
    }
    if (S.code.join('').length === 6) verifyCode();
  }

  function burst() {
    var cols = ['var(--accent)', 'var(--success)', 'var(--warning)', 'var(--accentHi)', 'var(--t1)'];
    var out = '';
    for (var i = 0; i < 20; i++) {
      var ang = (i / 20) * Math.PI * 2 + ((i * 37) % 30 - 15) * Math.PI / 180;
      var r = 120 + ((i * 53) % 50);
      var sz = 5 + (i * 7) % 5;
      out += '<span class="burst" style="width:' + sz + 'px;height:' + Math.round(sz * (i % 2 ? 1 : 0.5)) + 'px;margin:-' + Math.round(sz / 2) + 'px;background:' + cols[i % 5] +
        ';--dx:' + Math.round(Math.cos(ang) * r) + 'px;--dy:' + Math.round(Math.sin(ang) * r) + 'px;--rot:' + (180 + (i * 67) % 360) + 'deg"></span>';
    }
    return out;
  }

  function readiness() {

      head({ icon: h[0], title: h[1], sub: h[2],

      body + '</div><div class="foot line">' + footer + '</div>' + navStep(step);

  function nextStep(step) {
    var n = step + 1;
    while (n < 7 && S.done[n]) n++;
    return 's' + n;
  }

    return btn(step === 7 ? 'Готово' : 'Продолжить', 'done:' + step, 'p', !canNext) +

    }
    var cur = S.view === 'b' ? S.b : S.c;
    var options = S.view === 'b'
      ? B_SCREENS.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === cur ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('')
      : C_GROUPS.map(function (g) {
        return '<optgroup label="' + g[0] + '">' + g[1].map(function (x) {
          return '<option value="' + x[0] + '"' + (x[0] === cur ? ' selected' : '') + '>' + x[1] + '</option>';
        }).join('') + '</optgroup>';
      }).join('');
    var nav = '<div class="nav"><button data-a="prev">‹ Назад</button><select id="jump">' + options +
      '</select><button data-a="next">Далее ›</button>' +
      (S.view === 'c' ? '<button data-a="restart">Сначала</button>' : '') + '</div>';
    var theme = '<label><input type="checkbox" data-opt="light"' + (S.light ? ' checked' : '') + '> Светлая тема</label>';
    var opts = S.view === 'b' ? '<div class="opts">' + theme + '</div>' : S.view === 'c'
      ? '<div class="opts">' + theme + '<label>Сценарий <select id="scenario">' + SCENARIOS.map(function (x) {
        return '<option value="' + x[0] + '"' + (S.scenario === x[0] ? ' selected' : '') + '>' + x[1] + '</option>';
      }).join('') + '</select></label>' +
        '<label><input type="checkbox" data-opt="showIds"' + (S.showIds ? ' checked' : '') + '> Показывать дату рождения и номер</label>' +
        '<label><input type="checkbox" data-opt="full"' + (S.full ? ' checked' : '') + '> Профиль готов на 100 %</label>' +
        '<label><input type="checkbox" data-opt="autoNext"' + (S.autoNext ? ' checked' : '') + '> Автопереход</label>' +
        '<label><input type="checkbox" data-opt="dev"' + (S.dev ? ' checked' : '') + '> Для разработки</label></div>'
      : '';
    var dev = S.view === 'c' && S.dev && DEV[cur] ? '<div class="note dev">' + DEV[cur] + '</div>' : '';
    BAR.innerHTML = seg + nav + opts + '<div class="note">' + (NOTES[cur] || '') + '</div>' + dev;
  }

  function refreshScreen() {
    if (S.view !== 'c') return;
    if (S.c === 'q05') refreshData();
    else if (S.c === 'q06' || S.c === 's1') refreshAcct();
    else if (S.c === 'e07') refreshManual();
  }

  function render() {
    writeHash();
    renderBar();
    if (S.view === 'a') {
      STAGE.innerHTML = '<iframe class="frameA" src="index.html" title="Текущий прототип"></iframe>';
      return;
    }
    STAGE.innerHTML = S.view === 'b' ? screenB(S.b) : screenC(S.c);
    S.fx = {};
    refreshScreen();
  }

  function softRender() {
    var body = STAGE.querySelector('.body');
    var top = body ? body.scrollTop : 0;
    S.anim = 'still';
    render();
    S.pop = false;
    var nb = STAGE.querySelector('.body');
    if (nb) nb.scrollTop = top;
  }

  function go(id) {
    clearTimers();
    S.sheet = null;
    S.toast = null;
    var list = S.view === 'b' ? B_SCREENS : C_SCREENS;
    var from = list.findIndex(function (x) { return x[0] === (S.view === 'b' ? S.b : S.c); });
    var to = list.findIndex(function (x) { return x[0] === id; });
    S.anim = to < from ? 'bw' : 'fw';
    if (S.view === 'c') {
      if (id === 'q09') S.loadingProfile = true;
      if (id === 'q07' || id === 's1c') resetCode();
      if (id === 'o01') S.slide = 0;
      if (id === 'g03') { S.sheet = 'gate'; S.gate = 'apply'; }
    }
    if (S.view === 'b') S.b = id; else S.c = id;
    render();
    if (S.view === 'c') onEnter(id);
  }

  function onEnter(id) {
    if (id === 'q04') startReading();
    if (id === 'q09') later(function () { S.loadingProfile = false; softRender(); }, 650);
    if (id === 'e04') {
      var t = function () { later(function () { S.cd = Math.max(0, S.cd - 1); var el = document.getElementById('cd'); if (el) el.textContent = fmtCd(S.cd); t(); }, 1000); };
      t();
    }
    if (id === 'q03') prefillUpload();
    if (id === 'q05') { S.orig = {}; DOC_KEYS.forEach(function (k) { S.orig[k] = dval(k); }); }
    if (id === 'q07' || id === 's1c') {
      codeTick(S.cdTok);
      var f = document.querySelector('#otp input');
      if (f) f.focus();
    }
    if (['q05', 'q06', 'q07', 'q08', 'q09', 'q10', 'q11', 'p01', 'p02', 'p03'].indexOf(id) >= 0) prefillAll(id);
  }

  function prefillUpload() {
    if (S.cv.st === 'up') S.cv = { st: 'done', p: 100 };
    if (S.doc.st === 'up') S.doc.st = 'done';
  }

  function prefillAll(id) {
    var changed = false;
    if (S.cv.st !== 'done') { S.cv = { st: 'done', p: 100 }; changed = true; }
    if (!S.doc.pages) { S.doc.pages = 1; S.doc.st = 'done'; changed = true; }
    if (['q08', 'q09', 'q10', 'p01', 'p02', 'p03'].indexOf(id) >= 0 && S.fast && !S.done[2]) { S.done = { 1: true, 2: true, 3: true, 4: true, 6: true }; changed = true; }
    if (changed && id !== 'q09') softRender();
  }

  function startReading() {
    prefillAll('q04');
    S.phase = 1;
    S.readDone = false;
    softRender();
    var sc = S.scenario;
    var stopAt = { blur: 1, notSeafarer: 1, offline: 1, rate: 0, ban: 3, docTaken: 3 }[sc];
    var target = { blur: 'e01', notSeafarer: 'e02', offline: 'e03', rate: 'e04', ban: 'e05', docTaken: 'e06' }[sc] || 'q05';
    var step = function (ph) {
      later(function () {
        S.phase = ph;
        softRender();
        if ((stopAt !== undefined && ph > stopAt) || ph === 4) {
          if (sc === 'noName') { S.first = ''; S.last = ''; }
          S.readTarget = target;
          if (S.autoNext) { later(function () { go(target); }, 600); return; }
          S.readDone = true;
          S.fx.ready = true;
          softRender();
          return;
        }
        step(ph + 1);
      }, ph === 0 ? 600 : 1200);
    };
    step(2);
  }

  function simulateUpload(which, done) {
    var o = which === 'cv' ? S.cv : S.doc;
    o.st = 'up'; o.p = 0;
    if (which === 'cv') S.fx.cvIn = true; else S.fx.pgIn = true;
    softRender();
    var tick = function () {
      later(function () {
        o.p = Math.min(100, o.p + 17 + Math.round(Math.random() * 12));
        if (o.p >= 100) {
          o.st = 'done'; o.p = 100;
          if (which === 'cv') S.fx.cvDone = true; else S.fx.docDone = true;
          if (S.cv.st === 'done' && S.doc.pages > 0 && S.doc.st === 'done') S.fx.ready = true;
          softRender();
          if (done) done();
          return;
        }
        softRender();
        tick();
      }, 120);
    };
    tick();
  }

  function closeSheet(after) {
    var sh = STAGE.querySelector('.sheet');
    if (!sh) { S.sheet = null; if (after) after(); else softRender(); return; }
    sh.classList.add('out');
    setTimeout(function () {
      S.sheet = null;
      if (after) after(); else softRender();
    }, 200);
  }

  function showToast(text, undo) {
    S.toast = { text: text, undo: undo, fresh: true };
    softRender();
    S.toast.fresh = false;
    later(function () { S.toast = null; softRender(); }, 4000);
  }

  function move(delta) {
    var list = S.view === 'b' ? B_SCREENS : C_SCREENS;
    var cur = S.view === 'b' ? S.b : S.c;
    var i = list.findIndex(function (x) { return x[0] === cur; });
    var n = Math.min(list.length - 1, Math.max(0, i + delta));
    go(list[n][0]);
  }

  function restart(to) {
    var keep = { view: S.view, scenario: S.scenario, showIds: S.showIds, light: S.light, dev: S.dev, autoNext: S.autoNext, full: S.full };
    S = initial();
    Object.keys(keep).forEach(function (k) { S[k] = keep[k]; });
    go(to || 'o01');
  }

  /* ---------- действия ---------- */

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    var a = el.getAttribute('data-a');
    if (el.tagName === 'A') e.preventDefault();
    if (a === 'noop') { e.stopPropagation(); return; }
    if (a === 'blocked') {
      var needs = STAGE.querySelectorAll('[data-need]');
      if (needs.length) {
        needs[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
        for (var n = 0; n < needs.length; n++) shake(needs[n]);
      } else shake(el);
      var hint = STAGE.querySelector('.need');
      if (hint) shake(hint);
      return;
    }
    if (a === 'sheet-bg') { closeSheet(); return; }

    if (a.indexOf('view:') === 0) { clearTimers(); S.view = a.slice(5); S.anim = 'fw'; render(); return; }
    if (a.indexOf('b:') === 0 || a.indexOf('c:') === 0) { go(a.slice(2)); return; }
    if (a.indexOf('sheet:') === 0) { S.sheet = a.slice(6); softRender(); return; }
    if (a.indexOf('type:') === 0) { S.doc.type = a.slice(5); S.doc2 = false; softRender(); return; }
    if (a.indexOf('gate:') === 0) { S.gate = a.slice(5); S.sheet = 'gate'; softRender(); return; }
    if (a.indexOf('reg-act:') === 0) { showToast(a === 'reg-act:apply' ? 'Отклик отправлен (пример)' : 'Готово (пример)', null); return; }
    if (a.indexOf('home-tab:') === 0) { S.homeTab = a.slice(9); softRender(); return; }
    if (a.indexOf('slide:') === 0) { S.slide = Number(a.slice(6)); S.anim = 'fw'; render(); return; }
    if (a.indexOf('revoke:') === 0) { S.revoke = a.slice(7); S.sheet = 'revoke'; softRender(); return; }
    if (a.indexOf('regrant:') === 0) {
      var rk = a.slice(8);
      delete S.revoked[rk];
      if (rk === 'med') S.medConsent = true;
      showToast('Согласие дано снова', null);
      return;
    }
    if (a.indexOf('done:') === 0) {
      var st = Number(a.slice(5));
      S.done[st] = true;
      delete S.done['skip' + st];
      if (st === 7) { S.fast = false; go('q09'); return; }
      go(nextStep(st));
      return;
    }
    if (a.indexOf('skip:') === 0) {
      var sk = Number(a.slice(5));
      S.done['skip' + sk] = true;
      go(nextStep(sk));
      return;
    }

    switch (a) {
      case 'prev': move(-1); break;
      case 'next': move(1); break;
      case 'restart': restart('o01'); break;
      case 'restart-reg': restart('o02'); break;
      case 'sheet-close': closeSheet(); break;
      case 'start-quick': S.fast = true; go('o03'); break;
      case 'start-step': S.done = {}; S.fast = false; go('o04'); break;
      case 'slide-next': S.slide = Math.min(SLIDES.length - 1, S.slide + 1); S.anim = 'fw'; render(); break;
      case 'gate-fast': closeSheet(function () { S.fast = true; go('o03'); }); break;
      case 'gate-step': closeSheet(function () { S.done = {}; S.fast = false; go('o04'); }); break;
      case 'login-sheet': S.sheet = 'login'; softRender(); break;
      case 'login-go': closeSheet(function () { S.fast = true; if (!S.email) S.email = 'andrii@example.com'; go('q09'); }); break;
      case 'recover': closeSheet(function () { showToast('Ссылка для восстановления отправлена', null); }); break;
      case 'theme': S.light = !S.light; softRender(); break;
      case 'download-data': showToast('Копию данных отправим на ваш email', null); break;
      case 'do-revoke':
        closeSheet(function () {
          S.revoked[S.revoke] = true;
          if (S.revoke === 'med') { S.medConsent = false; S.med = false; }
          showToast('Согласие отозвано', null);
        });
        break;
      case 'toggle-terms': S.consentTerms = !S.consentTerms; S.pop = true; softRender(); break;
      case 'toggle-data': S.consentData = !S.consentData; S.pop = true; softRender(); break;
      case 'toggle-med': S.medConsent = !S.medConsent; S.pop = true; if (!S.medConsent) S.med = false; else delete S.revoked.med; softRender(); break;
      case 'pick-cv': closeSheet(function () { simulateUpload('cv'); }); break;
      case 'rm-cv':
        clearTimers();
        var cvBak = S.cv;
        S.cv = { st: 'none', p: 0 };
        showToast('CV удалено', function () { S.cv = cvBak; });
        break;
      case 'pick-doc': closeSheet(function () { S.doc.pages = Math.min(2, S.doc.pages + 1); simulateUpload('doc'); }); break;
      case 'pick-doc-step': S.doc.pages = 1; S.doc.st = 'done'; softRender(); break;
      case 'add-doc2': S.doc2 = true; S.fx.d2 = true; softRender(); break;
      case 'rm-doc2': S.doc2 = false; softRender(); break;
      case 'rm-doc':
        clearTimers();
        var docBak = { pages: S.doc.pages, st: S.doc.st };
        S.doc.pages = 0; S.doc.st = 'none';
        showToast('Документ удалён', function () { S.doc.pages = docBak.pages; S.doc.st = docBak.st; });
        break;
      case 'undo':
        if (S.toast && S.toast.undo) S.toast.undo();
        S.toast = null;
        softRender();
        break;
      case 'add-med': S.med = true; softRender(); break;
      case 'rm-med': S.med = false; softRender(); break;
      case 'photo': S.photo = !S.photo; softRender(); break;
      case 'go-read': go('q04'); break;
      case 'read-next': go(S.readTarget || 'q05'); break;
      case 'stop-read': closeSheet(function () { go('q03'); }); break;
      case 'retake': S.doc.pages = 0; S.doc.st = 'none'; S.doc2 = false; S.scenario = 'ok'; go('q03'); break;
      case 'upload-file': S.doc.pages = 0; S.doc.st = 'none'; S.doc2 = false; S.scenario = 'ok'; go('q03'); S.sheet = 'doc'; softRender(); break;
      case 'pick-mfile': S.m.file = true; softRender(); break;
      case 'rm-mfile': S.m.file = false; softRender(); break;
      case 'manual-done':
        S.manual = true; S.scenario = 'ok'; S.edited = {};
        S.d.docNum = S.m.num; S.d.docIssue = S.m.issue; S.d.docExp = S.m.exp;
        S.doc.type = S.m.name === DOC_TYPES[1].n ? 'diploma' : 'sid';
        S.first = ''; S.last = ''; S.d.birth = '';
        go('q05');
        break;
      case 'toggle-pass':
        S.showPass = !S.showPass;
        softRender();
        var p = document.getElementById('f-pass');
        if (p) { p.focus(); p.setSelectionRange(p.value.length, p.value.length); }
        break;
      case 'acct-next':
        S.creating = true;
        softRender();
        later(function () {
          S.creating = false;
          if (S.scenario === 'emailTaken') { S.emailTaken = true; softRender(); return; }
          go(S.c === 's1' ? 's1c' : 'q07');
        }, 900);
        break;
      case 'resend':
        S.codeCd = 60; S.codeTries = 5; S.code = ['', '', '', '', '', '']; S.codeErr = ''; S.cdTok++;
        codeTick(S.cdTok);
        showToast('Код отправлен ещё раз', null);
        var f0 = document.querySelector('#otp input');
        if (f0) f0.focus();
        break;
      case 'fill-profile': {
        if (S.fast && !S.done[2]) S.done = { 1: true, 2: true, 3: true, 4: true, 6: true };
        var fo = firstOpenStep();
        go('s' + fo);
        break;
      }
      case 'resume': go('q05'); break;
      case 'later-out': go('c08'); break;
      default: break;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.getAttribute) return;
    var oi = t.getAttribute('data-otp');
    if (oi !== null) { otpInput(t, Number(oi)); return; }
    var b = t.getAttribute('data-bind');
    if (!b) return;
    if (b.indexOf('d.') === 0) S.d[b.slice(2)] = t.value;
    else if (b.indexOf('m.') === 0) S.m[b.slice(2)] = t.value;
    else S[b] = t.value;
    var key = b.indexOf('d.') === 0 ? b.slice(2) : b;
    if (S.c === 'q05' && DOC_KEYS.indexOf(key) >= 0) {
      var og = (S.orig || {})[key];
      if (og && t.value !== og) S.edited[key] = true; else delete S.edited[key];
      var tg = document.querySelector('[data-tag="' + key + '"]');
      if (tg && tg.getAttribute('data-kind')) {
        if (S.edited[key]) { tg.className = 'tag w'; tg.textContent = 'исправлено вами'; }
        else if (S.manual && ['docNum', 'docIssue', 'docExp'].indexOf(key) >= 0) { tg.className = 'tag w'; tg.textContent = 'введено вручную'; }
        else { tg.className = 'tag'; tg.innerHTML = ic('sparkle', 11, 2) + 'из документа'; }
      }
      var en = document.getElementById('editedNote');
      if (en) en.innerHTML = editedNote();
    }
    if (b === 'email') {
      if (S.emailTaken) { S.emailTaken = false; var ae = document.getElementById('acctErr'); if (ae) ae.innerHTML = ''; }
    }
    refreshScreen();
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (!t.getAttribute || t.getAttribute('data-otp') === null) return;
    var i = Number(t.getAttribute('data-otp'));
    if (e.key === 'Backspace' && !t.value && i > 0) {
      var boxes = document.querySelectorAll('#otp input');
      S.code[i - 1] = '';
      boxes[i - 1].value = '';
      boxes[i - 1].classList.remove('f');
      boxes[i - 1].focus();
      e.preventDefault();
    }
  });

  document.addEventListener('focusout', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'f-email') {
      setTimeout(function () {
        refreshAcct();
        if (S.scenario === 'emailTaken' && emailOk(S.email) && !S.emailTaken) {
          S.emailTaken = true;
          var ae = document.getElementById('acctErr');
          if (ae) ae.innerHTML = takenBanner();
          refreshAcct();
        }
      }, 0);
    }
    if (t.id === 'f-pass2') { S.p2blur = true; refreshAcct(); }
    if (t.id === 'f-pass2' && S.pass2 && S.pass2 !== S.pass) {
      t.classList.remove('shake');
      void t.offsetWidth;
      t.classList.add('shake');
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'jump') { go(e.target.value); return; }
    if (e.target.id === 'scenario') { S.scenario = e.target.value; S.emailTaken = false; renderBar(); return; }
    var k = e.target.getAttribute && e.target.getAttribute('data-opt');
    if (k) { S[k] = e.target.checked; softRender(); }
  });

  document.addEventListener('scroll', function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains('body')) return;
    var nb = STAGE.querySelector('.navbar');
    if (!nb) return;
    nb.classList.toggle('scrolled', t.scrollTop > 8);
    nb.classList.toggle('titled', t.scrollTop > 70);
  }, true);

  window.addEventListener('hashchange', function () { readHash(); render(); });

  readHash();
  render();
  if (S.view === 'c') onEnter(S.c);
})();
</script>
</body>
</html>
