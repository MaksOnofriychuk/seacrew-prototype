<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeaCrew — регистрация моряка</title>
<style>
:root{
  --bg:#0B1117;--page:#070C11;--surface:#121A22;--raised:#1A2430;--nav:#0E151C;--input:#0F1720;
  --border:#243242;--divider:#16202B;--strong:#3A4A5C;
  --t1:#E8EEF3;--t2:#9AA8B5;--t3:#96A3AF;--muted:#5C6B79;
  --accent:#2EC4B6;--accentHi:#5FD9CE;--onAccent:#062723;
  --tint08:rgba(var(--accentRGB),.08);--tint:rgba(var(--accentRGB),.12);--accentBorder:rgba(var(--accentRGB),.25);
  --success:#3FB950;--successBg:rgba(63,185,80,.12);
  --warning:#E3A008;--warningBg:rgba(227,160,8,.14);--warningSoft:rgba(227,160,8,.07);--warningBorder:rgba(227,160,8,.35);
  --danger:#F26A6A;--dangerBg:rgba(242,106,106,.12);--dangerBorder:rgba(242,106,106,.35);
  --accentRGB:46,196,182;--docA:#1E2A36;--docB:#141D26;--docLine:#2A3846;--heroA:#0E1922;--chrome:#05080B;--homeBar:#E8EEF3;--shadow:rgba(0,0,0,.35);
}
.screen.light{
  --bg:#F4F6F8;--surface:#FFFFFF;--raised:#EBEFF3;--nav:#FFFFFF;--input:#F9FAFB;
  --border:#C9D2DB;--divider:#E6EBF0;--strong:#8C99A6;
  --t1:#0B1117;--t2:#4A5866;--t3:#55616D;--muted:#7A8794;
  --accent:#096E64;--accentHi:#0B8578;--onAccent:#FFFFFF;
  --tint08:rgba(9,110,100,.08);--tint:rgba(9,110,100,.12);--accentBorder:rgba(9,110,100,.25);
  --success:#177030;--successBg:rgba(23,112,48,.12);
  --warning:#845600;--warningBg:rgba(132,86,0,.14);--warningSoft:rgba(132,86,0,.07);--warningBorder:rgba(132,86,0,.35);
  --danger:#B82525;--dangerBg:rgba(184,37,37,.12);--dangerBorder:rgba(184,37,37,.35);
  --accentRGB:9,110,100;--docA:#E9EEF2;--docB:#DCE3E9;--docLine:#C3CDD6;--heroA:#E3EFEE;--homeBar:#0B1117;--shadow:rgba(11,17,23,.12);
  color:var(--t1);
}
.screen.light .status{color:#0B1117}
.screen.light .sheet{background:rgba(11,17,23,.4)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--t1);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
input::placeholder{color:var(--muted)}
a{color:var(--accent);text-decoration:none}
svg{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes ring{from{stroke-dashoffset:302}to{stroke-dashoffset:0}}
@keyframes shimmer{0%{opacity:.45}50%{opacity:1}100%{opacity:.45}}
@keyframes scan{0%{top:6%}50%{top:86%}100%{top:6%}}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes boxpop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
@keyframes typeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes sk{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes waveX{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sweep{0%{left:-70%}45%,100%{left:120%}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(var(--accentRGB),0)}50%{box-shadow:0 0 18px 2px rgba(var(--accentRGB),.35)}}
@keyframes zap{0%,40%,100%{transform:scale(1);opacity:1}46%{transform:scale(1.18);opacity:.75}52%{transform:scale(.96);opacity:1}}
@keyframes drawOnce{to{stroke-dashoffset:0}}
@keyframes draw{0%{stroke-dashoffset:24}35%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:-24}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes conf{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 40px)) rotate(var(--rot)) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes dropSweep{0%,30%{background-position:120% 0}70%,100%{background-position:-20% 0}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(var(--accentRGB),0)}50%{box-shadow:0 0 0 6px rgba(var(--accentRGB),.10)}}
@keyframes growIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pgIn{from{opacity:0;transform:scale(.7) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sink{to{transform:translateY(100%)}}
@keyframes readyPulse{0%{box-shadow:0 0 0 0 rgba(var(--accentRGB),.5)}100%{box-shadow:0 0 0 14px rgba(var(--accentRGB),0)}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,30px) scale(1.12)}}
@keyframes rock{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(1px)}}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.35)}}
@keyframes bubble{0%{opacity:0;transform:translate(0,0)}15%{opacity:.5}100%{opacity:0;transform:translate(var(--bx),-150px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}.stag,.act,.sheet .in > .btn{opacity:1!important;animation:none!important}.choice .lines svg path{stroke-dasharray:none!important;stroke-dashoffset:0!important}.drop::before,.choice.hi::before,.bub,.burst{display:none!important}}

/* панель обзора */
.bar{position:sticky;top:0;z-index:10;background:rgba(7,12,17,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap;justify-content:center}
.seg button{background:none;border:none;color:var(--t2);font-size:13px;font-weight:600;padding:9px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--onAccent)}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.nav button,.nav select{background:var(--surface);border:1px solid var(--border);color:var(--t1);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer}
.nav select{max-width:300px}
.opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:12px;color:var(--t2)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts select{background:var(--surface);border:1px solid var(--border);color:var(--t1);border-radius:8px;padding:6px 8px;font-size:12px}
.note{max-width:760px;font-size:13px;line-height:1.5;color:var(--t2);text-align:center}
.note b{color:var(--t1)}
.note.dev{border:1px dashed var(--strong);border-radius:10px;padding:8px 12px;text-align:left}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent)}

/* сцена и телефон */
.stage{display:flex;justify-content:center;padding:24px 12px 48px}
.frameA{width:100%;max-width:1100px;height:calc(100vh - 150px);min-height:900px;border:1px solid var(--border);border-radius:14px;background:var(--page)}
.phone{width:390px;height:844px;max-width:100%;border-radius:54px;background:#05080B;padding:11px;box-shadow:0 0 0 1px #2A3644,0 0 0 4px #0D141B,0 40px 90px rgba(0,0,0,.55);flex-shrink:0}
.screen{position:relative;width:100%;height:100%;border-radius:44px;background:var(--bg);color:var(--t1);transition:background .25s;overflow:hidden;display:flex;flex-direction:column}
.status{height:50px;position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 32px 0 34px;font-size:15px;font-weight:600;z-index:4;pointer-events:none}
.status .sig{display:flex;gap:5px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:3}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--homeBar);opacity:.85;z-index:6}
.inner{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:50px;animation:enter .22s ease-out}
.inner.fw{animation:inR .26s cubic-bezier(.2,.8,.2,1)}
.inner.bw{animation:inL .26s cubic-bezier(.2,.8,.2,1)}
.inner.still{animation:none}
.body{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:8px 22px 24px;gap:14px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body > *{flex-shrink:0}
.body > .hero.grow{flex-shrink:1}
.body.center{justify-content:center}
.inner > .body:last-child{padding-bottom:44px}
.welcome{gap:14px}
.underbar{margin-top:-50px}
.underbar .hero{margin-top:-8px;padding-top:96px}
.welcome .card{padding:16px}
.feats{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.feat{display:inline-flex;align-items:center;gap:5px;padding:6px 10px 6px 8px;border-radius:20px;background:var(--tint);border:1px solid var(--accentBorder);color:var(--t1);font-size:12.5px;font-weight:600;backdrop-filter:blur(6px)}
.feat svg{color:var(--accent)}
.stag{opacity:0;animation:riseIn .32s cubic-bezier(.2,.8,.2,1) forwards}
.inner.still .stag,.inner.bw .stag{opacity:1;animation:none}
.choice{position:relative;overflow:hidden}
.choice:active{transform:scale(.97);transition-duration:.09s}
.choice.hi::before{content:'';position:absolute;top:0;bottom:0;width:60%;left:-70%;background:linear-gradient(100deg,rgba(var(--accentRGB),0),rgba(var(--accentRGB),.14),rgba(var(--accentRGB),0));animation:sweep 6s 1.2s ease-in-out infinite;pointer-events:none}
.choice.hi .ico svg{animation:zap 1.2s .5s ease-in-out 1}
.choice .lines svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:drawOnce .9s .55s ease-out forwards}
.welcome .hero.grow{max-height:500px}
.hero > *{flex-shrink:0}
.foot{flex-shrink:0;padding:12px 22px 30px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.foot.line{border-top:1px solid var(--border);background:var(--bg)}

/* типографика */
.h1{font-size:28px;font-weight:700;line-height:1.18;letter-spacing:-.3px;text-wrap:balance}
.h2{font-size:17px;font-weight:700;line-height:1.3}
.h3{font-size:15px;font-weight:600;line-height:1.3}
.sub{font-size:15px;color:var(--t2);line-height:1.45}
.small{font-size:13px;color:var(--t2);line-height:18px}
.over{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--t2)}

/* кнопки */
.btn{border:none;border-radius:12px;min-height:50px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.p{transition:transform .12s,opacity .2s,box-shadow .25s,filter .15s}
.btn.p:not([disabled]){box-shadow:0 6px 18px rgba(var(--accentRGB),.22)}
.btn.s:active,.btn.g:active,.btn.d:active{opacity:.6}
.btn.ready{animation:readyPulse .6s ease-out}
.back:active,.link:active{opacity:.5}
.btn.p{background:var(--accent);color:var(--onAccent)}
.btn.s{background:var(--raised);color:var(--t1);border:1px solid var(--border)}
.btn.g{background:none;color:var(--accent);font-weight:500;font-size:15px;min-height:44px;padding:8px}
.btn.d{background:none;color:var(--danger);font-weight:500;font-size:15px;min-height:44px;padding:8px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.busy{pointer-events:none}
.btn.off{opacity:.38}
.btn .sp{width:18px;height:18px;border:2.5px solid rgba(6,39,35,.25);border-top-color:var(--onAccent);border-radius:50%;animation:spin .8s linear infinite}
.back{background:none;border:none;color:var(--t1);padding:10px;margin-left:-10px;cursor:pointer;min-height:44px;min-width:44px;align-self:flex-start;display:flex;align-items:center;justify-content:center}
.link{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:12px 0;margin:-12px 0}

/* поля */
.field{display:flex;flex-direction:column;gap:6px}
.field .lr{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:18px}
.field label{font-size:13px;color:var(--t2)}
.ctl{position:relative}
.field input,.field select{width:100%;background:var(--input);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--t1);font-size:15px;min-height:46px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--accent)}
.field input.err{border-color:var(--danger)}
.field input.ok{border-color:rgba(63,185,80,.55)}
.field input[readonly]{color:var(--t2);background:var(--surface)}
.field .eye{position:absolute;right:1px;top:50%;transform:translateY(-50%);width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--t2);cursor:pointer}
.field .msg{font-size:12px;line-height:1.4;min-height:0}
.field .msg.e{color:var(--danger)}
.field .msg.n{color:var(--t2)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--tint);color:var(--accent);white-space:nowrap}
.tag.w{background:var(--warningBg);color:var(--warning)}
.tag.m{background:var(--raised);color:var(--t2)}
.tag.ok{background:var(--successBg);color:var(--success)}
.meter{display:flex;gap:4px}
.meter span{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .2s}

/* карточки */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;gap:10px;overflow-x:auto;margin:0 -22px;padding:0 22px 2px;scrollbar-width:none}.hrow::-webkit-scrollbar{display:none}
.card.mini{flex:0 0 148px;gap:6px;padding:12px;cursor:pointer}.row>.btn{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px}.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--t2);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s}
.chip.on{background:var(--tint);border-color:var(--accentBorder);color:var(--accent)}
.chip:active{transform:scale(.96)}
.composer{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 14px;color:var(--t2);font-size:14px;cursor:pointer}
.composer>span:nth-child(2){flex:1}
.card.post,.card.job{cursor:pointer;transition:transform .12s}
.card.post:active,.card.job:active{transform:scale(.99)}
.card.job{gap:8px}
.card.news{border-color:var(--accentBorder);background:linear-gradient(180deg,var(--tint08),var(--surface) 70%)}
.photo,.docprev{position:relative;height:170px;border-radius:12px;overflow:hidden;background:var(--raised);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--t2);isolation:isolate}
.docprev{height:180px;border-radius:16px;background:var(--surface)}
.photo .glow,.docprev .glow,.photo .bub,.docprev .bub{display:none}
.photo .sea,.docprev .sea{position:absolute;left:0;right:0;bottom:0;height:90px;overflow:hidden;z-index:-1}
.photo .sea svg,.docprev .sea svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.docprev .lockb{position:absolute;right:10px;bottom:10px;display:flex;gap:5px;align-items:center;font-size:12px;font-weight:600;color:var(--success);background:var(--successBg);padding:4px 9px;border-radius:20px}
.pacts{display:flex;gap:18px;border-top:1px solid var(--divider);padding-top:10px}
.pacts button{background:none;border:none;color:var(--t2);display:flex;gap:6px;align-items:center;font-size:13.5px;cursor:pointer;padding:0}
.pacts button:last-child{margin-left:auto}
.pacts button.on{color:var(--danger)}.pacts button.on svg{fill:currentColor}
.bubble{background:var(--surface);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:14px;display:flex;flex-direction:column;gap:3px;flex:1;line-height:1.45}
.search{display:flex;align-items:center;gap:8px;background:var(--input);border:1px solid var(--border);border-radius:12px;padding:0 12px;min-height:46px;color:var(--t2)}
.search>span{display:flex}
.search input{flex:1;background:none;border:none;outline:none;color:var(--t1);font-size:15px;min-width:0}
.fbtn,.addb,.sendb{width:46px;height:46px;border-radius:12px;border:1px solid var(--accentBorder);background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.addb{width:40px;height:40px}
.heart{background:none;border:none;color:var(--t2);cursor:pointer;padding:4px;display:flex;flex-shrink:0}
.heart.on{color:var(--accent)}.heart.on svg{fill:currentColor}
.heart.big{width:50px;height:50px;border-radius:12px;border:1px solid var(--border);background:var(--raised);align-items:center;justify-content:center}
.match{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--success);font-weight:600}.match span{display:flex}
.jtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jt{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.notif{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.notif.new{border-color:var(--accentBorder)}
.ndot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0}
.ico.w{background:var(--warningBg);border-color:var(--warningBorder);color:var(--warning)}
.ico.ok{background:var(--successBg);border-color:rgba(63,185,80,.35);color:var(--success)}
.ta{width:100%;background:var(--input);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--t1);font-size:15px;resize:none;outline:none;font-family:inherit;line-height:1.5}
.ta:focus{border-color:var(--accent)}
.cntb{background:var(--accent);color:var(--bg);font-size:12px;font-weight:700;border-radius:10px;padding:1px 7px}
.mi>div .small{margin-top:2px}
.body.np{padding-top:52px}
.stag > .over:first-child{display:block;margin:10px 4px 8px}
.stag > .over:only-child{margin-bottom:-6px}
.card .kv:first-child{padding-top:4px}.card .kv:last-child{padding-bottom:2px}
.sheet .over{margin:6px 0 -4px}
.screen.app::before{content:"";position:absolute;left:0;right:0;top:0;height:54px;z-index:4;pointer-events:none;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 1px 0 var(--divider);opacity:0;transition:opacity .2s}
.screen.app.scrolled::before{opacity:1}
.screen.app.scrolled:has(.navbar)::before{opacity:0}
/* фон приложения: морская карта */
.appbg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.appbg .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(var(--accentRGB),.07) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--accentRGB),.07) 1px,transparent 1px);background-size:44px 44px;background-position:-1px 20px;-webkit-mask-image:radial-gradient(120% 70% at 85% 0%,#000 10%,transparent 70%);mask-image:radial-gradient(120% 70% at 85% 0%,#000 10%,transparent 70%)}
.appbg .g1{position:absolute;width:420px;height:420px;right:-170px;top:-190px;border-radius:50%;background:radial-gradient(circle,rgba(var(--accentRGB),.28),rgba(var(--accentRGB),0) 65%);animation:drift 12s ease-in-out infinite alternate}

@keyframes fillw{to{width:100%}}
@keyframes tapp{0%,60%,100%{transform:scale(1)}70%{transform:scale(.94)}80%{transform:scale(1)}}
@keyframes fadeInOut{0%{opacity:0;transform:scale(.8)}15%{opacity:1;transform:scale(1)}100%{opacity:1}}
.drawer{position:absolute;inset:0;z-index:6;display:flex;animation:fade .18s}
.drawer .dim{flex:1;background:rgba(4,8,12,.55)}
.drawer .pane{width:84%;height:100%;background:var(--surface);border-right:1px solid var(--border);padding:62px 20px 30px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;animation:slideIn .26s cubic-bezier(.2,.8,.2,1);order:-1;box-shadow:12px 0 40px var(--shadow)}
.drawer.out{animation:fadeOut .2s forwards}
.drawer.out .pane{animation:slideOut .2s ease-in forwards}
.drawer .mi{display:flex;gap:14px;align-items:center;padding:11px 4px;font-size:16px;font-weight:600;cursor:pointer;border-radius:10px;transition:background .15s}
.drawer .mi:active{background:var(--raised)}
.drawer .mi .cnt{margin-left:auto;font-size:13px;font-weight:600;color:var(--t2)}
.drawer .sep{height:1px;background:var(--divider);margin:2px 0}
.availpill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;align-self:flex-start;border:1px solid}
.availpill .d{width:8px;height:8px;border-radius:50%;background:currentColor}
.avbtn{width:36px;height:36px;border-radius:50%;background:var(--tint);border:1px solid var(--accentBorder);color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:none}}
@keyframes slideOut{to{transform:translateX(-100%)}}
.ambient-bg{background:radial-gradient(110% 55% at 100% 0%,rgba(var(--accentRGB),.20),transparent 62%)}
.ambient-bg.tone-warn{background:radial-gradient(110% 55% at 100% 0%,rgba(227,160,8,.16),transparent 62%)}
.ambient-bg.tone-muted{background:radial-gradient(110% 55% at 100% 0%,rgba(154,168,181,.12),transparent 62%)}
.ambient-bg.tone-ok{background:radial-gradient(110% 55% at 100% 0%,rgba(63,185,80,.18),transparent 62%)}
.ambient-bg.tone-warn .glow{background:radial-gradient(circle,rgba(227,160,8,.2),rgba(227,160,8,0) 65%)}
.ambient-bg.tone-muted .glow{background:radial-gradient(circle,rgba(154,168,181,.14),rgba(154,168,181,0) 65%)}
.ambient-bg.tone-warn .sea,.ambient-bg.tone-muted .sea{opacity:.4;filter:grayscale(.7)}
.ambient-bg.tone-ok .glow{background:radial-gradient(circle,rgba(63,185,80,.22),rgba(63,185,80,0) 65%)}
.ambient .sea{height:120px}
.ambient .glow{right:-140px;top:-120px}
.logo.tile svg{animation:bob 3.2s ease-in-out infinite}
.tile.t-warn{color:var(--warning);border-color:var(--warningBorder)}
.tile.t-warn::after{border-color:var(--warning)}
.tile.t-muted{color:var(--t2);border-color:var(--border)}
.tile.t-muted::after{border-color:var(--strong)}
.tile.t-ok{color:var(--success);border-color:rgba(63,185,80,.35)}
.tile.t-ok::after{border-color:var(--success)}
.tone-warn .glow{background:radial-gradient(circle,rgba(227,160,8,.22),rgba(227,160,8,0) 65%)!important}
.tone-muted .glow{background:radial-gradient(circle,rgba(154,168,181,.16),rgba(154,168,181,0) 65%)!important}
.tone-ok .glow{background:radial-gradient(circle,rgba(63,185,80,.22),rgba(63,185,80,0) 65%)!important}
.tone-warn .sea,.tone-muted .sea{opacity:.45;filter:grayscale(.7)}
.tone-warn .bub,.tone-muted .bub{display:none}
.feat.ok{background:var(--successBg);border-color:rgba(63,185,80,.35)}
.feat.ok svg{color:var(--success)}
.scanbox{box-shadow:0 0 0 1px var(--accentBorder),0 18px 50px rgba(var(--accentRGB),.18)}
.hero .sea svg,.ambient .sea svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.hero .sea .w1,.ambient .sea .w1{animation:waveX 16s linear infinite}
.hero .sea .w2,.ambient .sea .w2{animation:waveX 24s linear infinite reverse;bottom:-6px}
.hero .sea .w3,.ambient .sea .w3{animation:waveX 34s linear infinite;bottom:-12px}
.hero .bub,.ambient .bub{position:absolute;bottom:20px;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;animation:bubble 7s ease-in infinite;z-index:-1}
.logo{position:relative;flex-shrink:0;width:60px;height:60px;border-radius:18px;background:linear-gradient(160deg,var(--raised),var(--surface));border:1px solid var(--accentBorder);display:flex;align-items:center;justify-content:center;color:var(--accent);box-shadow:0 10px 28px var(--shadow),inset 0 1px 0 rgba(255,255,255,.06)}
.logo svg{transform-origin:50% 18%;animation:rock 5s ease-in-out infinite}
.logo::after{content:'';position:absolute;inset:-1px;border-radius:18px;border:1.5px solid var(--accent);opacity:0;animation:pulse 1.6s .3s ease-out 1}

/* обработка */
.scanbox{position:relative;width:220px;height:140px;border-radius:14px;background:linear-gradient(160deg,var(--docA),var(--docB));border:1px solid var(--border);overflow:hidden;align-self:center}
.scanbox .ph{position:absolute;left:16px;top:18px;width:40px;height:52px;border-radius:5px;background:var(--docLine)}
.scanbox .ln{position:absolute;left:68px;height:6px;border-radius:3px;background:var(--docLine)}
.scanbox .mrz{position:absolute;left:14px;right:14px;bottom:14px;height:18px;background:repeating-linear-gradient(90deg,var(--docLine) 0 6px,transparent 6px 9px)}
.scanbox .beam{position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 18px 4px rgba(var(--accentRGB),.45);animation:scan 2.2s ease-in-out infinite}
.scanbox .hl{position:absolute;border:1.5px solid var(--accent);border-radius:4px;background:rgba(var(--accentRGB),.12);animation:shimmer 1.4s infinite}

/* успех */
.okring{width:108px;height:108px;align-self:center;position:relative}
.okring circle.track{stroke:var(--border)}
.okring circle.p{stroke:var(--accent);stroke-dasharray:302;animation:ring .7s ease-out forwards}
.okring .mk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent);animation:pop .45s .45s both}

/* мастер */
.whead{flex-shrink:0;padding:0 14px 12px 8px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.whead .top{display:flex;align-items:center;gap:2px}
.whead .t{flex:1;font-size:15px;font-weight:600}
.whead .later{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:8px}
.steps{display:flex;gap:4px;padding:0 6px}
.steps span{flex:1;height:4px;border-radius:3px;background:var(--border)}
.steps span.done{background:var(--accent)}
.steps span.cur{background:var(--accent);opacity:.55}
.tabs{flex-shrink:0;display:flex;border-top:1px solid var(--border);background:var(--nav);padding:8px 0 28px}
.tabs div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--t2)}
.tabs div.on{color:var(--accent)}
.avatar{width:88px;height:88px;border-radius:50%;background:var(--raised);border:1.5px dashed var(--strong);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--t2);font-size:11px;text-align:center;cursor:pointer;align-self:center}
.av{width:60px;height:60px;border-radius:50%;background:var(--tint);border:1px solid var(--accentBorder);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:20px;flex-shrink:0}
.pbar{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--warning);border-radius:3px}

/* онбординг, код, профиль */
.dots{display:flex;gap:8px;justify-content:center;align-items:center;min-height:24px}
.dots button{width:8px;height:8px;border-radius:4px;border:none;padding:0;background:var(--strong);transition:width .3s,background .2s;cursor:pointer}
.dots button.on{width:24px;background:var(--accent)}
.otp{display:flex;gap:8px}
.otp input{flex:1;min-width:0;height:58px;border-radius:12px;border:1px solid var(--border);background:var(--input);color:var(--t1);font-size:24px;font-weight:700;text-align:center;outline:none;padding:0;transition:border-color .15s}
.otp input:focus{border-color:var(--accent)}
.otp input.f{border-color:var(--accentBorder)}
.otp input.err{border-color:var(--danger)}
.menu{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.mi{display:flex;gap:12px;align-items:center;padding:11px 14px;min-height:56px;cursor:pointer;font-size:15px;transition:background .15s}
.mi + .mi{border-top:1px solid var(--divider)}
.mi:active{background:var(--raised)}
.mi .ico{width:34px;height:34px;border-radius:10px}
.mi .mv{margin-left:auto;font-size:14px;color:var(--t2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.grid2 .field{min-width:0}
.tabs div[role=button]:active{opacity:.6}
.field select{appearance:none;-webkit-appearance:none}
@media (max-width:440px){.phone{padding:0;border-radius:0;height:calc(100vh - 190px);min-height:700px;box-shadow:none}.screen{border-radius:0}.island,.home{display:none}}
</style>

  var NOTES = {

    b03: 'После регистрации моряк попадает на пустой список документов и добавляет их по одному.',

    o01: 'Четыре слайда — что приложение <b>закрывает</b>: 1) профиль из документов за минуту, без ручного ввода; 2) ответ на анкету агентства в один тап (автозаполнение из профиля); 3) лента и вакансии моряков; 4) документы под контролем — напоминания о сроках и шифрование. Над заголовком — «боль», которую снимаем. Иллюстрации — живые мини-сцены. «Пропустить» — сразу к выбору способа. Показываются при первом запуске.',
    o02: 'Три пути. <b>Пошагово</b> — основной, рекомендуемый: профиль по шагам, можно с перерывами. <b>Быстро</b> — CV и документ моряка. <b>Посмотреть без регистрации</b> — гость: аккаунт не создаётся. Внизу строка «Уже есть аккаунт? Войти» — для нового телефона или после выхода. Тот, кто уже вошёл, этот экран не видит: приложение сразу открывает ленту.',
    o03: 'Короткий экран после выбора «Быстро»: что приготовить — CV, удостоверение или диплом моряка, доступ к почте.',
    o04: 'Короткий экран после выбора «Пошагово»: регистрацию можно прервать и продолжить с любого шага и любого устройства.',
    g01: 'Гость видит образцы ленты — это заглушки, не настоящие публикации. Любое действие (отметка, сообщение, вкладки «Документы», «Профиль») открывает окно «Зарегистрируйтесь, чтобы…». <b>Приложение запоминает гостя на телефоне:</b> при следующем открытии он сразу попадает сюда, без слайдов и выбора способа.',
    g02: 'Образцы вакансий — тоже заглушки. «Откликнуться» требует аккаунта. Гость запоминается на телефоне, как и в ленте.',
    g03: 'Окно появляется на любое действие гостя и предлагает оба пути регистрации. «Не сейчас» возвращает к просмотру.',
    q02: 'Две отдельные галочки, заранее не отмечены: условия сервиса и политика конфиденциальности; обработка документов, включая чтение ИИ. Нужны обе — до загрузки первого файла. «Подробнее» открывает краткий текст простым языком. Экран не прокручивается.',
    q03: 'Обязательны CV и <b>один документ моряка на выбор</b>: удостоверение (Seafarer\'s ID) или диплом. Второй документ можно добавить сразу или позже. Файлы во временном хранилище, зашифрованы; большие фото уменьшаются. Пока аккаунта нет, файлы удаляются через 30 дней.',
    q04: 'ИИ читает CV и документы целиком: личные данные, документы, диплом, морской стаж. Отдельно из документа моряка берутся номер и дата рождения — для записи безопасности. Проверка по списку заблокированных — здесь же. Исход зависит от сценария в панели. В приложении экран идёт дальше сам; в прототипе — по кнопке (или включите «Автопереход»).',
    q05: 'Прочитанное сгруппировано: личные данные, документы, диплом, морской стаж. Каждое поле можно исправить; метка «из документа» показывает источник. Подтверждённое попадает в профиль и в автозаполнение анкет, неподтверждённое — нет. Если исправить номер или дату рождения, администратор получит пометку «данные документа введены вручную» и сверит их с фото. У документа и диплома: номер, дата выдачи, срок действия (или «Без срока действия»), страна выдачи, название документа.',
    q06: 'Email, пароль и повтор пароля. Если email уже занят, сразу показываем «Этот email уже зарегистрирован» и два выхода: «Войти» или «Восстановить пароль» (сценарий «Email уже занят»).',
    q07: 'Код из 6 цифр: действует 15 минут, 5 попыток. «Отправить ещё раз» доступно через 60 секунд. Можно изменить email; письмо могло попасть в «Спам». Закрыли приложение — при открытии сразу этот экран. <b>В прототипе верный код — 123456</b>, любой другой даёт ошибку.',
    q08: 'Аккаунт создан: файлы перенесены к моряку и зашифрованы его ключом, временные копии стёрты. Подтверждённые данные уже в профиле. Ниже — <b>прогресс заполнения профиля</b> и чего не хватает.',
    q09: '«Готовность к анкетам» считается <b>только по полям, которые чаще всего нужны агентствам в анкетах</b>: личные данные, документ моряка, диплом, медицинские, морской стаж. При 100 % — «Профиль заполнен», иначе — «Дополнить профиль» (ведёт на первый незаполненный шаг). Рекрутер видит «Профиль неполный», пока нет 100 %. Чтобы увидеть 100 %, включите галочку в панели.',
    q10: 'Каждое согласие хранится с версией текста и временем. «Отозвать согласие» — так же просто, как дать. Копию своих данных можно скачать отсюда и из профиля.',
    p04: 'Боковое меню, как в LinkedIn: открывается по аватару в левом верхнем углу главной. Сверху — кто вы: фото, имя, отметка «документ моряка проверен», должность, гражданство и <b>статус доступности</b> (нажмите, чтобы сменить) — то, что агентства ищут в первую очередь. Ниже — приглашения и анкеты, готовность к анкетам и <b>документы, которые скоро истекают</b>. Затем быстрый доступ: документы, стаж, CV одним PDF, анкеты, приглашения. Внизу — настройки и конфиденциальность.',
    p01: 'Лента — для общения моряков и новостей, <b>без служебных предупреждений</b>: сроки документов, приглашения и статусы откликов живут в «Уведомлениях», «Входящих» и в боковом меню. Сверху — «Поделитесь опытом или задайте вопрос», фильтр «Все · Моряки · Новости». В ленте: <b>публикации моряков</b> (у автора — отметка «документ моряка проверен», значит, пишут настоящие моряки), <b>новости Crew от администратора</b> (выделены, можно закрепить), рекламные карточки с пометкой «Реклама» — не чаще одной на несколько публикаций. Позже: подписка на компании, курсы с датами, изменения в правилах (STCW, MLC).',
    p05: 'Как в первом прототипе, в новом стиле. Поиск, кнопка фильтров, активные фильтры чипами, «Сохранить поиск» — пришлём новые вакансии в уведомления. В карточке: должность, зарплата, судно, дата посадки, контракт, агентство (отметка «проверено»), закладка и <b>«Подходит по профилю: 5 из 6»</b> — сравнение с документами и профилем моряка.',
    p02: 'Документы сгруппированы: документ моряка, дипломы и сертификаты, медицинские, CV. В строке — номер (скрыт, кроме последних цифр) и срок. Предупреждение показываем <b>только у истекающих</b>: срок на плашке и баннер сверху. Напоминаем за 60, 30 и 7 дней. «+» — добавить документ: ИИ прочитает, моряк проверит.',
    p03: 'Входящие открываются из профиля. Две вкладки: <b>«Приглашения»</b> — агентства зовут на вакансию или присылают анкету; главная кнопка <b>«Заполнить из профиля»</b> — анкета заполняется в один тап. <b>«Мои отклики»</b> — статусы: отправлен, просмотрен.',
    p06: 'Новая публикация: текст, фото, судно. Подсказка — не публиковать номера документов и личные данные. Публикации проходят модерацию.',
    p07: 'Публикация с комментариями. Отметка «Нравится», комментарии, «Поделиться».',
    p08: 'Страница вакансии. Сверху — должность, агентство и 4 главных параметра: зарплата, тип судна, посадка, контракт. <b>«Требования» сравниваются с профилем</b>: зелёное — есть, красное — «нет в профиле». Дальше — судно, описание, похожие вакансии. Внизу — закладка и «Откликнуться».',
    p12: 'Отклик: агентство получает <b>анкету, заполненную из профиля</b> (PDF). Если профиль не на 100 % — честно пишем, чего не хватает, но отклик отправить можно. Сопроводительное письмо — по желанию.',
    p13: 'Фильтры: должность, тип судна, зарплата от, дата посадки. По умолчанию подставляются из профиля моряка.',
    p11: 'Карточка документа: превью (зашифровано), данные из документа, подтверждённые моряком. Заменить фото, изменить данные (правка отмечается для администратора), удалить.',
    p14: 'Профиль: фото, имя, отметка «документ моряка проверен», должность и тип судна, <b>статус доступности</b> (нажмите, чтобы сменить). Готовность к анкетам. Разделы: «Мой профиль» (личные данные, стаж, должность, CV), «Работа» (сохранённые вакансии, уведомления, входящие), «Настройки». Документы — в отдельной вкладке.',
    p09: 'Сохранённые вакансии — закладка на карточке или странице вакансии.',
    p10: 'Уведомления: приглашения, <b>сроки документов</b>, новые вакансии по сохранённому поиску, ответы на комментарии, статусы откликов. Непрочитанные выделены. Тап ведёт туда, где нужно действие.',
    g04: 'Гость видит вакансию без сравнения с профилем. «Откликнуться» и закладка просят регистрацию.',
    q11: 'Моряк вернулся на том же телефоне, не закончив быструю регистрацию (до 30 дней). С другого устройства продолжить нельзя — аккаунта ещё нет. «Начать заново» <b>сразу удаляет файлы и прочитанные данные</b>, остаётся только запись «была попытка». <b>Лимит попыток не обнуляется:</b> он считается по телефону и IP.',
    e01: 'Фото размыто или обрезано. Три выхода: переснять, загрузить файл или ввести данные вручную. Число попыток ограничено.',
    e02: 'ИИ видит другой тип документа (например, загранпаспорт). Те же три выхода: переснять, загрузить файл, ввести вручную.',
    e07: 'Название документа, номер, дата выдачи, дата окончания, страна выдачи и фото или файл документа. Такой аккаунт получает пометку для администратора <b>«данные документа введены вручную»</b>; администратор сверяет данные с приложенным фото.',
    e06: 'Документ уже привязан к другому аккаунту: один документ — один аккаунт. Предлагаем войти или восстановить доступ.',
    e03: 'Нет сети при загрузке или чтении. Файлы, которые уже загрузились, не теряются; повтор происходит сам.',
    e04: 'Ограничение на число попыток с одного телефона за время — защита от ботов.',
    e05: 'Номер документа в списке заблокированных. Текст нейтральный: причину не называем. Попытка записывается без файлов.',
    s1: 'Email, пароль, повтор пароля и две галочки согласия — до создания аккаунта. Дальше код из письма; после него аккаунт создан, и можно остановиться на любом шаге и продолжить с любого устройства.',
    s1c: 'Тот же экран кода, что и в быстром способе. <b>В прототипе верный код — 123456.</b>',
    s2: 'Фото, имя, фамилия, дата рождения, гражданство, телефон, должность. Шаг можно пропустить.',
    s3: 'Обязателен <b>один документ моряка: удостоверение или диплом</b>; второй — по желанию. Из каждого берётся запись безопасности. Без этого защита от повторных аккаунтов не работает.',
    s4: 'Другие документы и сертификаты; тип выбирает моряк. Послужная книжка при регистрации не запрашивается — её можно добавить позже из профиля как обычный документ.',
    s5: 'Отдельное согласие на медицинские данные. Копия хранится зашифрованной и удаляется после окончания срока действия; в профиле видно «Медосмотр действителен до …».',
    s6: 'Суда и рейсы. Шаг необязательный.',

    p01: 'Вкладки <code>app/(tabs)/_layout.tsx</code>: feed, vacancies, documents, profile. Стрічка — <code>FlatList</code> з типами елементів <code>post | news | ad</code> з API (<code>GET /feed?filter=</code>, курсорна пагінація), pull-to-refresh. Новини створює адмін у веб-адмінці; <code>pinned</code>. Лайк — оптимістичне оновлення. Реклама — окремий тип, частоту задає сервер.',

    p05: '<code>FlatList</code> вакансій, <code>GET /vacancies</code> з фільтрами; «Подходит по профилю» рахує сервер (вимоги вакансії ↔ поля профілю). Закладка — <code>POST/DELETE /vacancies/:id/save</code>. Збережений пошук — запис фільтрів + фонова перевірка нових.',

  function strength(p) {
    if (!p) return 0;
    var s = 0;
    if (p.length >= 8) s++;
    if (p.length >= 12) s++;
    if (/[0-9]/.test(p) && /[a-zA-Zа-яА-Я]/.test(p)) s++;
    if (/[^0-9a-zA-Zа-яА-Я]/.test(p)) s++;
    return Math.min(4, Math.max(p.length >= 8 ? 1 : 0, s));
  }

  function emailOk(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); }

  /* проверка данных из документов */

  var DOC_KEYS = ['first', 'last', 'birth', 'docNum', 'docIssue', 'docExp', 'docCountry', 'docName', 'dipNum', 'dipRank', 'dipIssue', 'dipExp', 'dipCountry', 'dipName'];

  function dval(k) { return (k === 'first' || k === 'last') ? S[k] : S.d[k]; }

  function srcTag(k, kind) {
    var cls = 'tag', txt = ic('sparkle', 11, 2) + (kind === 'cv' ? 'из CV' : 'из документа');
    if (!dval(k) && k !== 'cit' && k !== 'phone' && k.indexOf('vessel') !== 0) return '<span data-tag="' + k + '"></span>';
    if (kind !== 'cv' && S.manual && ['docNum', 'docIssue', 'docExp'].indexOf(k) >= 0) { cls = 'tag w'; txt = 'введено вручную'; }
    else if (S.edited[k]) { cls = 'tag w'; txt = 'исправлено вами'; }
    else if (S.scenario === 'noName' && (k === 'first' || k === 'last')) return '<span data-tag="' + k + '"></span>';
    return '<span class="' + cls + '" data-tag="' + k + '" data-kind="' + (kind || 'doc') + '">' + txt + '</span>';
  }

  function df(label, k, o) {
    o = o || {};
    var bind = (k === 'first' || k === 'last') ? k : 'd.' + k;
    return field(label, { value: dval(k), bind: bind, ph: o.ph || '', tag: srcTag(k, o.kind), ac: o.ac });
  }

  function expField(k, nk) {
    var off = !!S.d[nk];
    return (off ? field('Действителен до', { value: '', ph: 'Без срока действия', ro: true, tag: '<span class="tag m">бессрочно</span>' }) : df('Действителен до', k, { ph: 'ДД.ММ.ГГГГ' })) +
      '<div class="check sm" data-a="noexp:' + nk + '" role="checkbox" tabindex="0" aria-checked="' + off + '"><div class="box' + (off ? ' on' : '') + '">' + (off ? ic('check', 13, 2.6) : '') + '</div><div>Без срока действия</div></div>';
  }

  function plural(n, a, b, c) { var m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : (m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c)); }
  function months(per) {
    var m = String(per || '').match(/(\d{2})\.(\d{4})\D+(\d{2})\.(\d{4})/);
    if (!m) return 0;
    return Math.max(0, (+m[4] - +m[2]) * 12 + (+m[3] - +m[1]) + 1);
  }
  function durText(n) {
    if (!n) return '';
    var y = Math.floor(n / 12), mo = n % 12;
    return [y ? plural(y, 'год', 'года', 'лет') : '', mo ? plural(mo, 'месяц', 'месяца', 'месяцев') : ''].filter(Boolean).join(' ');
  }
  function durShort(n) { var y = Math.floor(n / 12), mo = n % 12; return [y ? y + ' г.' : '', mo ? mo + ' мес.' : ''].filter(Boolean).join(' '); }
  function seaTotal() { return durText(months(S.d.per1) + months(S.d.per2)); }

  function dataValid() { return !!(S.first.trim() && S.last.trim() && S.d.birth.trim() && S.d.docNum.trim()); }

  function refreshAcct() {
    var e = document.getElementById('f-email');

    var p = document.getElementById('f-pass'), p2 = document.getElementById('f-pass2');

    me.className = 'msg ' + (badEmail ? 'e' : 'n');
    me.textContent = badEmail ? 'Проверьте адрес — похоже, в нём опечатка' : '';
    var s = strength(S.pass);
    var cols = ['var(--border)', 'var(--danger)', 'var(--warning)', 'var(--accent)', 'var(--success)'];

    mp2.textContent = mism ? 'Пароли не совпадают' : (S.pass2 && S.pass2 === S.pass ? 'Пароли совпадают' : '');
    var b = document.getElementById('createBtn');

    var setNeed = function (el, bad) { if (el) { if (bad) el.setAttribute('data-need', '1'); else el.removeAttribute('data-need'); } };
    setNeed(e, !emailOk(S.email));

    var m = document.getElementById('missing');
    if (m) m.textContent = miss.length && !S.creating ? 'Осталось: ' + miss.join(', ') : '';

      W('<div class="otp" id="otp">' + boxes + '</div>', 1) +
      '<div class="msg ' + (S.codeErr ? 'e' : 'n') + '" id="codeMsg" style="font-size:13px;min-height:18px;text-align:center;color:' + (S.codeErr ? 'var(--danger)' : 'var(--t2)') + '">' + esc(S.codeErr) + '</div>' +

  function resetCode() {
    S.code = ['', '', '', '', '', '']; S.codeErr = ''; S.codeTries = 5; S.codeCd = 60; S.codeBusy = false; S.cdTok = (S.cdTok || 0) + 1;
  }

  function updateResend() {
    var el = document.getElementById('resend');
    if (!el) return;
    if (S.codeCd > 0) { el.textContent = 'Отправить ещё раз через ' + fmtCd(S.codeCd); el.setAttribute('data-a', 'blocked'); el.style.opacity = '.55'; el.style.fontWeight = ''; }
    else { el.textContent = 'Отправить ещё раз'; el.setAttribute('data-a', 'resend'); el.style.opacity = ''; el.style.fontWeight = '600'; }

  function codeTick(tok) {
    later(function () {
      if (tok !== S.cdTok) return;
      S.codeCd = Math.max(0, S.codeCd - 1);

      if (S.codeCd > 0) codeTick(tok);

  function verifyCode() {
    var code = S.code.join('');
    if (code.length < 6 || S.codeBusy) return;
    if (S.codeTries <= 0) { setCodeMsg('Попытки закончились. Отправьте код ещё раз.', true); return; }
    S.codeBusy = true;
    setCodeMsg('Проверяем…', false);
    later(function () {
      S.codeBusy = false;
      if (code === '123456') {
        if (S.c === 's1c') {
          S.done[1] = true;
          go('s2');
          showToast('Аккаунт создан', null);
        } else {
          S.fast = true;
          S.done = { 1: true, 2: true, 3: true, 4: true, 6: true };
          go('q08');
        }
        return;
      }
      S.codeTries = Math.max(0, S.codeTries - 1);
      S.code = ['', '', '', '', '', ''];
      var boxes = document.querySelectorAll('#otp input');
      for (var i = 0; i < boxes.length; i++) { boxes[i].value = ''; boxes[i].classList.remove('f'); }
      setCodeMsg(S.codeTries > 0 ? 'Неверный код. Осталось попыток: ' + S.codeTries : 'Неверный код. Попытки закончились — отправьте код ещё раз.', true);
      shake(document.getElementById('otp'));
      if (boxes[0]) boxes[0].focus();
    }, 700);
  }

  function otpInput(el, i) {
    var v = el.value.replace(/\D/g, '');

    if (S.codeErr) setCodeMsg('', false);
    if (v.length > 1) {
      for (var k = 0; k < v.length && i + k < 6; k++) S.code[i + k] = v.charAt(k);
      for (var j = 0; j < 6; j++) { boxes[j].value = S.code[j]; boxes[j].classList.toggle('f', !!S.code[j]); }
      var nx = Math.min(5, i + v.length);
      boxes[nx].focus();
    } else {
      S.code[i] = v;
      el.value = v;
      el.classList.toggle('f', !!v);
      if (v && i < 5) boxes[i + 1].focus();
    }
    if (S.code.join('').length === 6) verifyCode();
  }

    3: ['idcard', 'Документ моряка', 'Удостоверение или диплом — один из них обязателен.'],
    4: ['docs', 'Другие документы', 'Дипломы, сертификаты, визы и другое.'],
    5: ['medical', 'Медицинские документы', 'Отдельное согласие и защита данных.'],
    6: ['ship', 'Морской стаж', 'Суда и рейсы.'],
    7: ['shieldOk', 'Проверка', 'Последний взгляд перед завершением.']
  };

  function wizard(step, body, footer) {
    var bars = STEPS.map(function (s) {
      return '<span class="' + (S.done[s.n] ? 'done' : (s.n === step ? 'cur' : '')) + '"></span>';
    }).join('');
    var h = STEP_HEAD[step];
    return '<div class="body underbar">' +
      head({ icon: h[0], title: h[1], sub: h[2],
        extra: '<div class="small stag" style="margin-top:14px;animation-delay:.16s">Шаг ' + step + ' из 7 · ' + STEPS[step - 1].t + '</div><div class="steps stag" style="padding:0;margin-top:8px;animation-delay:.2s">' + bars + '</div>' }) +
      body + '</div><div class="foot line">' + footer + '</div>' + navStep(step);
  }

  function nextStep(step) {
    var n = step + 1;
    while (n < 7 && S.done[n]) n++;
    return 's' + n;
  }

  function stepFooter(step, canNext, optional) {
    return btn(step === 7 ? 'Готово' : 'Продолжить', 'done:' + step, 'p', !canNext) +
      (optional ? btn('Пропустить', 'skip:' + step, 'g') : '');
  }

  function screenStep(id) {
    if (id === 'c08') {
      var nextOpen = 1;
      for (var k = 1; k <= 7; k++) { if (!S.done[k]) { nextOpen = k; break; } }
      return phone('<div class="body underbar">' +
        head({ icon: 'anchor', title: 'С возвращением!', sub: 'Вы остановились на шаге ' + nextOpen + ' из 7 — «' + STEPS[nextOpen - 1].t + '».' }) +
        W('<div class="card"><div class="list">' + STEPS.map(function (s) {
          var st = S.done[s.n] ? '<span class="dot ok">' + ic('check', 13, 2.6) + '</span>' : (S.done['skip' + s.n] ? '<span class="dot skip">–</span>' : '<span class="dot wait">' + s.n + '</span>');
          return '<div class="li" style="align-items:center">' + st + '<span>' + s.t + '</span></div>';
        }).join('') + '</div></div>', 1) +
        '</div><div class="foot">' + btn('Продолжить', 'c:s' + nextOpen) + btn('Позже', 'c:q09', 'g') + '</div>');
    }
    var step = Number(id.slice(1));
    if (step === 1) {
      return phone(wizard(1,
        W(acctFields(), 1) +
        W('<div class="card">' + check(S.consentTerms, 'toggle-terms', 'Принимаю <a href="#" data-a="noop">Условия сервиса</a> и <a href="#" data-a="noop">Политику конфиденциальности</a>') +
          check(S.consentData, 'toggle-data', 'Согласен на обработку документов, включая чтение ИИ') +
          '<button class="link" style="align-self:flex-start" data-a="sheet:consent">Подробнее о согласии</button></div>', 2),
        acctBtn() + '<div class="need" id="missing"></div>'));
    }
    if (step === 2) {
      return phone(wizard(2,
        W('<div class="card"><div class="avatar" data-a="photo">' + (S.photo ? '<div class="av" style="width:84px;height:84px;font-size:26px">' + esc((S.first[0] || '') + (S.last[0] || '')) + '</div>' : ic('camera', 24) + 'Добавить<br>фото') + '</div>' +
          field('Имя', { value: S.first, bind: 'first', ph: 'Как в документе' }) +
          field('Фамилия', { value: S.last, bind: 'last', ph: 'Как в документе' }) +
          field('Дата рождения', { ph: 'ДД.ММ.ГГГГ' }) +
          field('Гражданство', { select: ['Выберите страну', 'Украина', 'Филиппины', 'Индия', 'Польша'] }) +
          field('Телефон', { type: 'tel', ph: '+380 …' }) +
          field('Должность', { select: ['Выберите должность', '3rd Engineer', '2nd Engineer', 'Chief Officer', 'AB Seaman'] }) + '</div>', 1),
        stepFooter(2, true, true)));
    }
    if (step === 3) {
      var has = S.doc.pages > 0;
      return phone(wizard(3,
        W('<div class="card"><div class="row" style="justify-content:space-between"><div class="h3">Какой документ загружаете?</div><span class="tag m">один обязателен</span></div>' + typesSeg() +
          (has ? uploadRow('idcard', esc(docType().n), 'Распознан', 'done', 100, 'rm-doc')
            : '<div class="drop" role="button" tabindex="0" data-need="doc" data-a="pick-doc-step"><div class="ico acc">' + ic('scan', 22) + '</div><div><div class="h3" style="font-size:14px">Сканировать или сфотографировать</div><div class="small">Страница с фото и данными</div></div></div>') +
          (has ? secondDoc() : '') +
          (S.scenario === 'ban' && has ? banner('d', 'shield', '<span>С этим документом нельзя продолжить регистрацию. Напишите в поддержку.</span>') : '') + '</div>', 1),
        stepFooter(3, has && S.scenario !== 'ban', false)));
    }
    if (step === 4) {
      return phone(wizard(4,
        W('<div class="card"><div class="small">Тип каждого документа выбираете вы.</div>' + uploadRow('doc', 'CoC — 3rd Engineer (III/1)', 'Распознан', 'done', 100, 'noop') +
          '<div class="drop" role="button" tabindex="0" data-a="noop"><div class="ico acc">' + ic('plus', 22) + '</div><div class="h3" style="font-size:14px">Добавить документ</div></div></div>', 1),
        stepFooter(4, true, true)));
    }
    if (step === 5) {
      var medBody = S.medConsent
        ? (S.med ? uploadRow('medical', 'Медицинский сертификат', 'Действителен до 14.10.2027 · удалится после', 'done', 100, 'rm-med')
          : '<div class="drop" role="button" tabindex="0" data-a="add-med"><div class="ico acc">' + ic('scan', 22) + '</div><div class="h3" style="font-size:14px">Добавить медицинский документ</div></div>')
        : '<div class="small">Чтобы загрузить медицинские документы, нужно отдельное согласие.</div>';
      return phone(wizard(5,
        W('<div class="card"><div class="list">' +
          '<div class="li"><span style="color:var(--accent)">' + ic('lock', 18) + '</span><span>Хранятся зашифрованными</span></div>' +
          '<div class="li"><span style="color:var(--accent)">' + ic('user', 18) + '</span><span>Видят только агентства, которым вы откроете доступ</span></div>' +
          '<div class="li"><span style="color:var(--accent)">' + ic('clock', 18) + '</span><span>Удаляются автоматически, когда закончится срок действия</span></div>' +
          '</div></div>', 1) +
        W('<div class="card">' + check(S.medConsent, 'toggle-med', 'Разрешаю хранить мои медицинские документы для трудоустройства') + medBody + '</div>', 2),
        stepFooter(5, true, true)));
    }
    if (step === 6) {
      return phone(wizard(6,
        W('<div class="card"><div class="seatotal"><span>' + ic('ship', 18) + '</span><div><div class="small">Общий стаж</div><div class="h3">' + durText(months(S.d.per1)) + '</div></div></div><div class="small">Можно добавить из страниц стажа или вручную.</div><div class="row"><span style="color:var(--accent)">' + ic('ship', 20) + '</span><div style="flex:1"><div class="h3">MV Example Star</div><div class="small">Container Ship · 3rd Engineer</div><div class="small">02.2024 – 09.2024 · <b style="color:var(--t1);font-weight:600">' + durText(months(S.d.per1)) + '</b></div></div></div>' +
          '<div class="drop" role="button" tabindex="0" data-a="noop"><div class="ico acc">' + ic('plus', 22) + '</div><div class="h3" style="font-size:14px">Добавить рейс</div></div></div>', 1),
        stepFooter(6, true, true)));
    }
    var reqOk = S.done[1] && S.done[3];
    return phone(wizard(7,
      W('<div class="card"><div class="list">' + STEPS.slice(0, 6).map(function (s) {
        var st = S.done[s.n] ? '<span class="dot ok">' + ic('check', 13, 2.6) + '</span>' : '<span class="dot skip">–</span>';
        var label = S.done[s.n] ? '' : (s.req ? '<span class="tag w">обязательно</span>' : '<span class="small">пропущено</span>');
        return '<div class="li" style="cursor:pointer;align-items:center" data-a="c:s' + s.n + '">' + st + '<span style="flex:1">' + s.t + '</span>' + label + '</div>';
      }).join('') + '</div></div>', 1) +
      W(reqOk ? '<div class="small">Пропущенные шаги можно заполнить позже из профиля.</div>'
        : banner('w', 'alert', '<span>Чтобы закончить, пройдите обязательные шаги 1 и 3.</span>'), 2),
      stepFooter(7, reqOk, false)));
  }

  function screenC(id) {
    switch (id) {
      case 'o01': return oSlides();
      case 'o02': return oChoice();
      case 'o03': return oPath('q');
      case 'o04': return oPath('s');
      case 'g01': return feedScreen(true);
      case 'g02': case 'g03': return jobsScreen(true);
      case 'g04': return jobScreen(true);
      case 'p01': return feedScreen(false);
      case 'p06': return newPostScreen();
      case 'p07': return postScreen();
      case 'p05': case 'p13': return jobsScreen(false);
      case 'p08': case 'p12': return jobScreen(false);
      case 'p04': S.drawer = true; return feedScreen(false);
      case 'p02': return docsScreen();
      case 'p11': return docScreen();
      case 'p09': return savedScreen();
      case 'p10': return notifScreen();
      case 'p03': return inboxScreen();
      case 'p14': return profileScreen();
      case 'q02': return qConsent();
      case 'q03': return qUpload();
      case 'q04': return qReading();
      case 'q05': return qCheck();
      case 'q06': return qAccount();
      case 'q07': case 's1c': return qCode();
      case 'q08': return qDone();
      case 'q09': return profileScreen();
      case 'q10': return qConsents();
      case 'q11': return qResume();
      case 'e01': case 'e02': case 'e03': case 'e04': case 'e05': case 'e06': return qError(id);
      case 'e07': return eManual();
      default: return screenStep(id);
    }
  }

  /* ---------- панель ---------- */

  function renderBar() {
    var seg = '<div class="seg">' +
      [['a', 'A · Текущий прототип'], ['b', 'B · Сейчас в TestFlight'], ['c', 'C · Новая регистрация']].map(function (v) {
        return '<button class="' + (S.view === v[0] ? 'on' : '') + '" data-a="view:' + v[0] + '">' + v[1] + '</button>';
      }).join('') + '</div>';
    if (S.view === 'a') {
      BAR.innerHTML = seg + '<div class="note">Прототип из Claude Design без изменений.</div>';
      return;
    }
    var cur = S.view === 'b' ? S.b : S.c;
    var options = S.view === 'b'
      ? B_SCREENS.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === cur ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('')
      : C_GROUPS.map(function (g) {
        return '<optgroup label="' + g[0] + '">' + g[1].map(function (x) {
          return '<option value="' + x[0] + '"' + (x[0] === cur ? ' selected' : '') + '>' + x[1] + '</option>';
        }).join('') + '</optgroup>';
      }).join('');
    var nav = '<div class="nav"><button data-a="prev">‹ Назад</button><select id="jump">' + options +
      '</select><button data-a="next">Далее ›</button>' +
      (S.view === 'c' ? '<button data-a="restart">Сначала</button>' : '') + '</div>';
    var theme = '<label><input type="checkbox" data-opt="light"' + (S.light ? ' checked' : '') + '> Светлая тема</label>';
    var opts = S.view === 'b' ? '<div class="opts">' + theme + '</div>' : S.view === 'c'
      ? '<div class="opts">' + theme + '<label>Сценарий <select id="scenario">' + SCENARIOS.map(function (x) {
        return '<option value="' + x[0] + '"' + (S.scenario === x[0] ? ' selected' : '') + '>' + x[1] + '</option>';
      }).join('') + '</select></label>' +
        '<label><input type="checkbox" data-opt="showIds"' + (S.showIds ? ' checked' : '') + '> Показывать дату рождения и номер</label>' +
        '<label><input type="checkbox" data-opt="full"' + (S.full ? ' checked' : '') + '> Профиль готов на 100 %</label>' +
        '<label><input type="checkbox" data-opt="autoNext"' + (S.autoNext ? ' checked' : '') + '> Автопереход</label>' +
        '<label><input type="checkbox" data-opt="dev"' + (S.dev ? ' checked' : '') + '> Для разработки</label></div>'
      : '';
    var dev = S.view === 'c' && S.dev && DEV[cur] ? '<div class="note dev">' + DEV[cur] + '</div>' : '';
    BAR.innerHTML = seg + nav + opts + '<div class="note">' + (NOTES[cur] || '') + '</div>' + dev;
  }

  function refreshScreen() {
    if (S.view !== 'c') return;
    if (S.c === 'q05') refreshData();
    else if (S.c === 'q06' || S.c === 's1') refreshAcct();
    else if (S.c === 'e07') refreshManual();
  }

  function render() {
    writeHash();
    renderBar();
    if (S.view === 'a') {
      STAGE.innerHTML = '<iframe class="frameA" src="index.html" title="Текущий прототип"></iframe>';
      return;
    }
    STAGE.innerHTML = S.view === 'b' ? screenB(S.b) : screenC(S.c);
    S.fx = {};
    refreshScreen();
  }

  function softRender() {
    var body = STAGE.querySelector('.body');
    var top = body ? body.scrollTop : 0;
    S.anim = 'still';
    render();
    S.pop = false;
    var nb = STAGE.querySelector('.body');
    if (nb) nb.scrollTop = top;
  }

  function go(id) {
    clearTimers();
    S.sheet = null;
    S.drawer = false;
    S.toast = null;
    var list = S.view === 'b' ? B_SCREENS : C_SCREENS;
    var from = list.findIndex(function (x) { return x[0] === (S.view === 'b' ? S.b : S.c); });
    var to = list.findIndex(function (x) { return x[0] === id; });
    S.anim = to < from ? 'bw' : 'fw';
    if (S.view === 'c') {
      if (id === 'q09') S.loadingProfile = true;
      if (id === 'q07' || id === 's1c') resetCode();
      if (id === 'o01') S.slide = 0;
      if (id === 'g03') { S.sheet = 'gate'; S.gate = 'apply'; }
      if (id === 'p12') S.sheet = 'apply';
      if (id === 'p13') S.sheet = 'filters';
      if (id === 'p14') S.loadingProfile = true;
    }
    if (S.view === 'b') S.b = id; else S.c = id;
    render();
    if (S.view === 'c') onEnter(id);
  }

  function onEnter(id) {
    if (id === 'q04') startReading();
    if (id === 'q09' || id === 'p14') later(function () { S.loadingProfile = false; softRender(); }, 650);
    if (id === 'e04') {
      var t = function () { later(function () { S.cd = Math.max(0, S.cd - 1); var el = document.getElementById('cd'); if (el) el.textContent = fmtCd(S.cd); t(); }, 1000); };
      t();
    }
    if (id === 'q03') prefillUpload();
    if (id === 'q05') { S.orig = {}; DOC_KEYS.forEach(function (k) { S.orig[k] = dval(k); }); }
    if (id === 'q07' || id === 's1c') {
      codeTick(S.cdTok);
      var f = document.querySelector('#otp input');
      if (f) f.focus();
    }
    if (['q05', 'q06', 'q07', 'q08', 'q09', 'q10', 'q11'].indexOf(id) >= 0 || id[0] === 'p') prefillAll(id);
  }

  function prefillUpload() {
    if (S.cv.st === 'up') S.cv = { st: 'done', p: 100 };
    if (S.doc.st === 'up') S.doc.st = 'done';
  }

  function prefillAll(id) {
    var changed = false;
    if (S.cv.st !== 'done') { S.cv = { st: 'done', p: 100 }; changed = true; }
    if (!S.doc.pages) { S.doc.pages = 1; S.doc.st = 'done'; changed = true; }
    if ((['q08', 'q09', 'q10'].indexOf(id) >= 0 || id[0] === 'p') && S.fast && !S.done[2]) { S.done = { 1: true, 2: true, 3: true, 4: true, 6: true }; changed = true; }
    if (changed && id !== 'q09' && id !== 'p14') softRender();
  }

  function startReading() {
    prefillAll('q04');
    S.phase = 1;
    S.readDone = false;
    softRender();
    var sc = S.scenario;
    var stopAt = { blur: 1, notSeafarer: 1, offline: 1, rate: 0, ban: 3, docTaken: 3 }[sc];
    var target = { blur: 'e01', notSeafarer: 'e02', offline: 'e03', rate: 'e04', ban: 'e05', docTaken: 'e06' }[sc] || 'q05';
    var step = function (ph) {
      later(function () {
        S.phase = ph;
        softRender();
        if ((stopAt !== undefined && ph > stopAt) || ph === 4) {
          if (sc === 'noName') { S.first = ''; S.last = ''; }
          S.readTarget = target;
          if (S.autoNext) { later(function () { go(target); }, 600); return; }
          S.readDone = true;
          S.fx.ready = true;
          softRender();
          return;
        }
        step(ph + 1);
      }, ph === 0 ? 600 : 1200);
    };
    step(2);
  }

  function simulateUpload(which, done) {
    var o = which === 'cv' ? S.cv : S.doc;
    o.st = 'up'; o.p = 0;
    if (which === 'cv') S.fx.cvIn = true; else S.fx.pgIn = true;
    softRender();
    var tick = function () {
      later(function () {
        o.p = Math.min(100, o.p + 17 + Math.round(Math.random() * 12));
        if (o.p >= 100) {
          o.st = 'done'; o.p = 100;
          if (which === 'cv') S.fx.cvDone = true; else S.fx.docDone = true;
          if (S.cv.st === 'done' && S.doc.pages > 0 && S.doc.st === 'done') S.fx.ready = true;
          softRender();
          if (done) done();
          return;
        }
        softRender();
        tick();
      }, 120);
    };
    tick();
  }

  function closeSheet(after) {
    var sh = STAGE.querySelector('.sheet');
    if (!sh) { S.sheet = null; if (after) after(); else softRender(); return; }
    sh.classList.add('out');
    setTimeout(function () {
      S.sheet = null;
      if (after) after(); else softRender();
    }, 200);
  }

  function showToast(text, undo) {
    S.toast = { text: text, undo: undo, fresh: true };
    softRender();
    S.toast.fresh = false;
    later(function () { S.toast = null; softRender(); }, 4000);
  }

  function move(delta) {
    var list = S.view === 'b' ? B_SCREENS : C_SCREENS;
    var cur = S.view === 'b' ? S.b : S.c;
    var i = list.findIndex(function (x) { return x[0] === cur; });
    var n = Math.min(list.length - 1, Math.max(0, i + delta));
    go(list[n][0]);
  }

  function restart(to) {
    var keep = { view: S.view, scenario: S.scenario, showIds: S.showIds, light: S.light, dev: S.dev, autoNext: S.autoNext, full: S.full };
    S = initial();
    Object.keys(keep).forEach(function (k) { S[k] = keep[k]; });
    go(to || 'o01');
  }

  /* ---------- действия ---------- */

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    var a = el.getAttribute('data-a');
    if (el.tagName === 'A') e.preventDefault();
    if (a === 'noop') { e.stopPropagation(); return; }
    if (a === 'blocked') {
      var needs = STAGE.querySelectorAll('[data-need]');
      if (needs.length) {
        needs[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
        for (var n = 0; n < needs.length; n++) shake(needs[n]);
      } else shake(el);
      var hint = STAGE.querySelector('.need');
      if (hint) shake(hint);
      return;
    }
    if (a === 'sheet-bg') { closeSheet(); return; }
    if (a === 'drawer') { S.drawer = true; softRender(); return; }
    if (a === 'drawer-close') { var dr = STAGE.querySelector('.drawer'); if (dr) dr.classList.add('out'); setTimeout(function () { S.drawer = false; if (S.c === 'p04') S.c = 'p01'; softRender(); }, 200); return; }
    if (a === 'avail-next') { S.avail = (S.avail + 1) % AVAIL.length; softRender(); return; }

    if (a.indexOf('view:') === 0) { clearTimers(); S.view = a.slice(5); S.anim = 'fw'; render(); return; }
    if (a.indexOf('b:') === 0 || a.indexOf('c:') === 0) { go(a.slice(2)); return; }
    if (a.indexOf('sheet:') === 0) { S.sheet = a.slice(6); softRender(); return; }
    if (a.indexOf('type:') === 0) { S.doc.type = a.slice(5); S.doc2 = false; softRender(); return; }
    if (a.indexOf('gate:') === 0) { S.gate = a.slice(5); S.sheet = 'gate'; softRender(); return; }
    if (a.indexOf('reg-act:') === 0) { showToast(a === 'reg-act:apply' ? 'Отклик отправлен (пример)' : 'Готово (пример)', null); return; }
    if (a.indexOf('feedf:') === 0) { S.feedF = a.slice(6); softRender(); return; }
    if (a.indexOf('post:') === 0) { S.post = a.slice(5); go('p07'); return; }
    if (a.indexOf('like:') === 0) { var lk = a.slice(5); S.liked[lk] = !S.liked[lk]; softRender(); return; }
    if (a.indexOf('job:') === 0) { S.job = Number(a.slice(4)); go('p08'); return; }
    if (a.indexOf('save:') === 0) { var sk = a.slice(5); S.saved[sk] = !S.saved[sk]; showToast(S.saved[sk] ? 'Вакансия сохранена' : 'Убрано из сохранённых', null); return; }
    if (a.indexOf('doc:') === 0) { S.docSel = a.slice(4); go('p11'); return; }
    if (a.indexOf('inbox:') === 0) { S.inboxTab = a.slice(6); softRender(); return; }
    if (a.indexOf('fchip:') === 0) { var fk = a.slice(6); S.fch[fk] = !S.fch[fk]; softRender(); return; }
    if (a.indexOf('toast:') === 0) { showToast(a.slice(6), null); return; }
    if (a === 'share') { showToast('Ссылка скопирована (пример)', null); return; }
    if (a === 'publish') { go('p01'); showToast('Публикация отправлена на проверку', null); return; }
    if (a === 'do-apply') { S.applied[S.job] = true; closeSheet(function () { if (S.c === 'p12') S.c = 'p08'; softRender(); showToast('Отклик отправлен — статус во «Входящих»', null); }); return; }
    if (a.indexOf('slide:') === 0) { S.slide = Number(a.slice(6)); S.anim = 'fw'; render(); return; }
    if (a.indexOf('revoke:') === 0) { S.revoke = a.slice(7); S.sheet = 'revoke'; softRender(); return; }
    if (a.indexOf('regrant:') === 0) {
      var rk = a.slice(8);
      delete S.revoked[rk];
      if (rk === 'med') S.medConsent = true;
      showToast('Согласие дано снова', null);
      return;
    }
    if (a.indexOf('done:') === 0) {
      var st = Number(a.slice(5));
      S.done[st] = true;
      delete S.done['skip' + st];
      if (st === 7) { S.fast = false; go('q09'); return; }
      go(nextStep(st));
      return;
    }
    if (a.indexOf('skip:') === 0) {
      var sk = Number(a.slice(5));
      S.done['skip' + sk] = true;
      go(nextStep(sk));
      return;
    }

    switch (a) {
      case 'prev': move(-1); break;
      case 'next': move(1); break;
      case 'restart': restart('o01'); break;
      case 'restart-reg': restart('o02'); break;
      case 'sheet-close': closeSheet(); break;
      case 'start-quick': S.fast = true; go('o03'); break;
      case 'start-step': S.done = {}; S.fast = false; go('o04'); break;
      case 'slide-next': S.slide = Math.min(SLIDES.length - 1, S.slide + 1); S.anim = 'fw'; render(); break;
      case 'gate-fast': closeSheet(function () { S.fast = true; go('o03'); }); break;
      case 'gate-step': closeSheet(function () { S.done = {}; S.fast = false; go('o04'); }); break;
      case 'login-sheet': S.sheet = 'login'; softRender(); break;
      case 'login-go': closeSheet(function () { S.fast = true; if (!S.email) S.email = 'andrii@example.com'; go('q09'); }); break;
      case 'recover': closeSheet(function () { showToast('Ссылка для восстановления отправлена', null); }); break;
      case 'theme': S.light = !S.light; softRender(); break;
      case 'download-data': showToast('Копию данных отправим на ваш email', null); break;
      case 'do-revoke':
        closeSheet(function () {
          S.revoked[S.revoke] = true;
          if (S.revoke === 'med') { S.medConsent = false; S.med = false; }
          showToast('Согласие отозвано', null);
        });
        break;
      case 'toggle-terms': S.consentTerms = !S.consentTerms; S.pop = true; softRender(); break;
      case 'toggle-data': S.consentData = !S.consentData; S.pop = true; softRender(); break;
      case 'toggle-med': S.medConsent = !S.medConsent; S.pop = true; if (!S.medConsent) S.med = false; else delete S.revoked.med; softRender(); break;
      case 'pick-cv': closeSheet(function () { simulateUpload('cv'); }); break;
      case 'rm-cv':
        clearTimers();
        var cvBak = S.cv;
        S.cv = { st: 'none', p: 0 };
        showToast('CV удалено', function () { S.cv = cvBak; });
        break;
      case 'pick-doc': closeSheet(function () { S.doc.pages = Math.min(2, S.doc.pages + 1); simulateUpload('doc'); }); break;
      case 'pick-doc-step': S.doc.pages = 1; S.doc.st = 'done'; softRender(); break;
      case 'add-doc2': S.doc2 = true; S.fx.d2 = true; softRender(); break;
      case 'rm-doc2': S.doc2 = false; softRender(); break;
      case 'rm-doc':
        clearTimers();
        var docBak = { pages: S.doc.pages, st: S.doc.st };
        S.doc.pages = 0; S.doc.st = 'none';
        showToast('Документ удалён', function () { S.doc.pages = docBak.pages; S.doc.st = docBak.st; });
        break;
      case 'undo':
        if (S.toast && S.toast.undo) S.toast.undo();
        S.toast = null;
        softRender();
        break;
      case 'add-med': S.med = true; softRender(); break;
      case 'rm-med': S.med = false; softRender(); break;
      case 'photo': S.photo = !S.photo; softRender(); break;
      case 'go-read': go('q04'); break;
      case 'read-next': go(S.readTarget || 'q05'); break;
      case 'stop-read': closeSheet(function () { go('q03'); }); break;
      case 'retake': S.doc.pages = 0; S.doc.st = 'none'; S.doc2 = false; S.scenario = 'ok'; go('q03'); break;
      case 'upload-file': S.doc.pages = 0; S.doc.st = 'none'; S.doc2 = false; S.scenario = 'ok'; go('q03'); S.sheet = 'doc'; softRender(); break;
      case 'pick-mfile': S.m.file = true; softRender(); break;
      case 'rm-mfile': S.m.file = false; softRender(); break;
      case 'manual-done':
        S.manual = true; S.scenario = 'ok'; S.edited = {};
        S.d.docNum = S.m.num; S.d.docIssue = S.m.issue; S.d.docExp = S.m.exp;
        S.doc.type = S.m.name === DOC_TYPES[1].n ? 'diploma' : 'sid';
        S.first = ''; S.last = ''; S.d.birth = '';
        go('q05');
        break;
      case 'noexp:docNoExp': case 'noexp:dipNoExp':
        var nk = a.slice(6); S.d[nk] = !S.d[nk]; softRender();
        break;
      case 'toggle-pass':
        S.showPass = !S.showPass;
        softRender();
        var p = document.getElementById('f-pass');
        if (p) { p.focus(); p.setSelectionRange(p.value.length, p.value.length); }
        break;
      case 'acct-next':
        S.creating = true;
        softRender();
        later(function () {
          S.creating = false;
          if (S.scenario === 'emailTaken') { S.emailTaken = true; softRender(); return; }
          go(S.c === 's1' ? 's1c' : 'q07');
        }, 900);
        break;
      case 'resend':
        S.codeCd = 60; S.codeTries = 5; S.code = ['', '', '', '', '', '']; S.codeErr = ''; S.cdTok++;
        codeTick(S.cdTok);
        showToast('Код отправлен ещё раз', null);
        var f0 = document.querySelector('#otp input');
        if (f0) f0.focus();
        break;
      case 'fill-profile': {
        if (S.fast && !S.done[2]) S.done = { 1: true, 2: true, 3: true, 4: true, 6: true };
        var fo = firstOpenStep();
        go('s' + fo);
        break;
      }
      case 'resume': go('q05'); break;
      case 'later-out': go('c08'); break;
      default: break;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t.getAttribute) return;
    var oi = t.getAttribute('data-otp');
    if (oi !== null) { otpInput(t, Number(oi)); return; }
    var b = t.getAttribute('data-bind');
    if (!b) return;
    if (b.indexOf('d.') === 0) S.d[b.slice(2)] = t.value;
    else if (b.indexOf('m.') === 0) S.m[b.slice(2)] = t.value;
    else S[b] = t.value;
    var key = b.indexOf('d.') === 0 ? b.slice(2) : b;
    if (S.c === 'q05' && DOC_KEYS.indexOf(key) >= 0) {
      var og = (S.orig || {})[key];
      if (og && t.value !== og) S.edited[key] = true; else delete S.edited[key];
      var tg = document.querySelector('[data-tag="' + key + '"]');
      if (tg && tg.getAttribute('data-kind')) {
        if (S.edited[key]) { tg.className = 'tag w'; tg.textContent = 'исправлено вами'; }
        else if (S.manual && ['docNum', 'docIssue', 'docExp'].indexOf(key) >= 0) { tg.className = 'tag w'; tg.textContent = 'введено вручную'; }
        else { tg.className = 'tag'; tg.innerHTML = ic('sparkle', 11, 2) + 'из документа'; }
      }
      var en = document.getElementById('editedNote');
      if (en) en.innerHTML = editedNote();
    }
    if (b === 'email') {
      if (S.emailTaken) { S.emailTaken = false; var ae = document.getElementById('acctErr'); if (ae) ae.innerHTML = ''; }
    }
    refreshScreen();
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (!t.getAttribute || t.getAttribute('data-otp') === null) return;
    var i = Number(t.getAttribute('data-otp'));
    if (e.key === 'Backspace' && !t.value && i > 0) {
      var boxes = document.querySelectorAll('#otp input');
      S.code[i - 1] = '';
      boxes[i - 1].value = '';
      boxes[i - 1].classList.remove('f');
      boxes[i - 1].focus();
      e.preventDefault();
    }
  });

  document.addEventListener('focusout', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'f-email') {
      setTimeout(function () {
        refreshAcct();
        if (S.scenario === 'emailTaken' && emailOk(S.email) && !S.emailTaken) {
          S.emailTaken = true;
          var ae = document.getElementById('acctErr');
          if (ae) ae.innerHTML = takenBanner();
          refreshAcct();
        }
      }, 0);
    }
    if (t.id === 'f-pass2') { S.p2blur = true; refreshAcct(); }
    if (t.id === 'f-pass2' && S.pass2 && S.pass2 !== S.pass) {
      t.classList.remove('shake');
      void t.offsetWidth;
      t.classList.add('shake');
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'jump') { go(e.target.value); return; }
    if (e.target.id === 'scenario') { S.scenario = e.target.value; S.emailTaken = false; renderBar(); return; }
    var k = e.target.getAttribute && e.target.getAttribute('data-opt');
    if (k) { S[k] = e.target.checked; softRender(); }
  });

  document.addEventListener('scroll', function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains('body')) return;
    var sc = STAGE.querySelector('.screen');
    if (sc) sc.classList.toggle('scrolled', t.scrollTop > 8);
    var nb = STAGE.querySelector('.navbar');
    if (!nb) return;
    nb.classList.toggle('scrolled', t.scrollTop > 8);
    nb.classList.toggle('titled', t.scrollTop > 70);
  }, true);

  window.addEventListener('hashchange', function () { readHash(); render(); });

  readHash();
  render();
  if (S.view === 'c') onEnter(S.c);
})();
</script>
</body>
</html>
